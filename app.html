      <td class="pname">${esc(r.owner)}${r.place?` <span class="postag">${r.place}${["st","nd","rd"][r.place-1]||"th"}</span>`:""}</td>
      <td class="mono">${money(-s.p.buyIn)}</td>
      <td class="mono">${r.weeks ? r.weeks+" \u00d7 "+money(s.p.weeklyPrize) : "\u2014"}</td>
      <td class="mono">${r.placePrize ? money(r.placePrize) : "\u2014"}</td>
      <td class="mono ${r.net>0?"live":(r.net<0?"zero":"")}">${money(r.net)}</td>
    </tr>`).join("");

  return picker + `<div class="grid-owner">
      <h4>${season} pot</h4>
      <div class="import-help">Everyone chips in the buy-in; it all comes back out as three
        place prizes plus a prize for the top score each week. The two sides have to balance,
        dollar for dollar.</div>
      <div class="addform" style="grid-template-columns:repeat(5,auto) 1fr; align-items:center; gap:14px;">
        <label>Buy-in ${num(p.buyIn,"buyIn",null)}</label>
        <label>1st ${num(p.places[0],"place",0)}</label>
        <label>2nd ${num(p.places[1],"place",1)}</label>
        <label>3rd ${num(p.places[2],"place",2)}</label>
        <label>Weekly ${num(p.weeklyPrize,"weeklyPrize",null)}</label>
      </div>
      <table class="previewtable" style="margin-top:12px;">
        <tbody>
          <tr><td>In &mdash; ${owners.length} owners &times; ${money(p.buyIn)}</td>
              <td class="mono" style="text-align:right">${money(s.potIn)}</td></tr>

          <tr><td>Out &mdash; ${(p.weeks||[]).length} weekly prizes &times; ${money(p.weeklyPrize)}</td>
              <td class="mono" style="text-align:right">${money(s.weeklyOut)}</td></tr>
          <tr${s.balanced?' class="iskeeper"':''}>

      ${s.balanced ? "" : `<div class="tiewarn">The pot and the prizes are

    <div class="grid-owner">
      <h4>${season} weekly top scorer</h4>

        <button class="btn secondary small" onclick="addPayoutWeek(${season})">+ Add week</button>
      </div>`}
    </div>

    <div class="grid-owner">
      <h4>${season} per owner</h4>
      <div class="import-help">Buy-in against everything won back. Place prizes follow the final
        standings${s.standings.length ? "" : " \u2014 none stored for " + season + " yet, so only weekly prizes are counted"}.</div>
      <table class="previewtable">
        <thead><tr><th>Owner</th><th>Buy-in</th><th>Weekly</th><th>Place</th><th>Net</th></tr></thead>
        <tbody>${ledgerRows}</tbody>
      </table>
    </div>`;
}

function honoursData(){
  const seasons = STATE.seasons || {};
  return Object.keys(seasons).map(Number).sort((a,b)=>b-a)
    .map(y => {
      const st = (seasons[y].standings || []).slice().sort((a,b)=>a.rank-b.rank);
      if(st.length < 3) return null;
      return { year: y, first: st[0], second: st[1], third: st[2], sacko: st[st.length-1] };
    }).filter(Boolean);
}

function statsData(){
  const seasons = STATE.seasons || {};
  const years = Object.keys(seasons).map(Number).sort((a,b)=>a-b);
  const titles = {}, sackos = {}, keeps = {}, runs = {}, winnings = {}, nearly = {};

  honoursData().forEach(h => {
    titles[h.first.owner] = (titles[h.first.owner] || 0) + 1;
    sackos[h.sacko.owner] = (sackos[h.sacko.owner] || 0) + 1;
    // On the podium, never on the top step. Counted per finish, so two 2nds
    // and a 3rd is three trips to the almost-pile.
    nearly[h.second.owner] = (nearly[h.second.owner] || 0) + 1;
    nearly[h.third.owner] = (nearly[h.third.owner] || 0) + 1;
  });

  // Keeper counts straight off the drafts; a kept pick carries keeperCost.
  const keptBy = {};   // deriveKey -> [{year, owner}]
  years.forEach(y => (seasons[y].draft || []).forEach(d => {
    if(d.keeperCost != null && d.owner){
      keeps[d.owner] = (keeps[d.owner] || 0) + 1;
      const k = deriveKey(d.player);
      (keptBy[k] = keptBy[k] || []).push({ year: y, owner: d.owner });
    }
  }));
  // A player kept in back-to-back years by the same owner = a full three-year
  // run (draft year plus both keeps) — the cap, actually reached.
  Object.keys(keptBy).forEach(k => {
    const ks = keptBy[k].sort((a,b)=>a.year-b.year);
    for(let i = 1; i < ks.length; i++){
      if(ks[i].year === ks[i-1].year + 1 && ks[i].owner === ks[i-1].owner){
        runs[ks[i].owner] = (runs[ks[i].owner] || 0) + 1;
      }
    }
  });

  Object.keys(STATE.payouts || {}).forEach(y => {
    const s = payoutSummary(+y);
    if(s) s.ledger.forEach(r => { if(r.won > 0) winnings[r.owner] = (winnings[r.owner] || 0) + r.won; });
  });

  const top = (m) => Object.keys(m).map(o => ({ owner: o, n: m[o] }))
    .sort((a,b) => b.n - a.n || a.owner.localeCompare(b.owner));
  return { titles: top(titles), sackos: top(sackos), keeps: top(keeps),
           runs: top(runs), winnings: top(winnings), nearly: top(nearly) };
}

/* Draft night and the keeper deadline, as live countdowns. The clock ticks in
   the reader's own browser — the page is static, so the numbers are rendered
   once at publish time and then driven by the small script at the bottom. A
   date that has already passed collapses to a plain "done" note instead of
   counting upward, which is the one thing a countdown must never do. */
function keyDatesSection(){
  const e = eventsFor(STATE.season);
  if(!e) return "";
  const tz = eventTz(STATE.season);
  const hasDraft = !!eventDate(e.draftAt, tz);
  const hasDeadline = !!eventDate(e.keeperDeadline, tz);
  if(!hasDraft && !hasDeadline && !e.venue && !e.address) return "";

  /* data-deadline carries an absolute UTC instant, never the wall-clock string.
     The countdown runs in each reader's own browser, so a naive string would be
     read in their timezone -- someone three hours east would have counted down
     to the wrong moment and turned up early. */
  const clock = (label, iso, cal, extra) => {
    const at = eventInstant(iso, tz);
    return `<div class="cdblock" data-deadline="${esc(at ? at.toISOString() : "")}">
      <small>${label}</small>
      <div class="cdclock">
        <span class="cdnum" data-unit="d">&mdash;</span><i>d</i>
        <span class="cdnum" data-unit="h">&mdash;</span><i>h</i>
        <span class="cdnum" data-unit="m">&mdash;</span><i>m</i>
        <span class="cdnum" data-unit="s">&mdash;</span><i>s</i>
      </div>
      <span class="cdwhen">${esc(formatEventWhen(iso, tz))}</span>
      ${cal || ""}
      ${extra || ""}
    </div>`;
  };

  // Where the draft is belongs to the draft, inside its own box.
  const where = [];
  if(e.venue) where.push(`<b>${esc(e.venue)}</b>`);
  if(e.address) where.push(`${esc(e.address)}<br>
    <a href="${esc(mapsUrl(e.address))}" target="_blank" rel="noopener noreferrer">Open in Maps &rarr;</a>`);
  const whereBlock = where.length
    ? `<div class="cdwhere">&#128205; ${where.join("<br>")}</div>` : "";

  return `<section class="rules" id="key-dates">
    <h2>${STATE.season} &mdash; mark your calendar</h2>
    <div class="cdgrid">
      ${hasDeadline ? clock("Keeper Deadline", e.keeperDeadline,
          calendarLinks(STATE.season + " WHS keeper deadline", e.keeperDeadline, 30, "",
            "Set your two keepers in Yahoo before this deadline.", tz)) : ""}
      ${hasDraft ? clock("Draft Night", e.draftAt,
          calendarLinks(STATE.season + " WHS Fantasy Football draft", e.draftAt, 180,
            [e.venue, e.address].filter(Boolean).join(", "), "", tz),
          whereBlock) : ""}
    </div>
    ${!hasDraft && whereBlock ? whereBlock : ""}
  </section>`;
}

/* The draft order, for the published page — but only once it is locked. An
   unlocked order can still be re-rolled, and publishing a number people plan
   around and then changing it is worse than publishing nothing. */
function draftOrderSection(){
  const o = draftOrderFor(STATE.season);
  if(!o || !(o.order || []).length) return "";
  const provisional = !o.locked;
  /* Same shape the commissioner sees on the Draft Order tab: gold row and a
     pill for the seeded picks naming where they finished, plain italics for the
     drawn ones. The finishing place is the whole justification for the order,
     so publishing it without that note published the conclusion and hid the
     reasoning. */
  const standings = lastStandings(STATE.season);
  const rows = o.order.map((owner,i)=>{
    const pick = i + 1;
    const fixed = o.seeded.includes(owner);
    const place = fixed ? standings.findIndex(s => s.owner === owner) + 1 : null;
    return `<tr${fixed ? ' class="keptrow"' : ''}>
      <td class="rdcell" style="width:12%">${pick}</td>
      <td class="pcell">${esc(owner)}</td>
      <td>${fixed && place > 0
            ? `<span class="chip tie">finished ${ordinal(place)} &mdash; picks ${
                pick === o.order.length ? "last" : "at " + pick}</span>`
            : `<span class="notkept">drawn at random</span>`}</td>
    </tr>`;
  }).join("");
  return `<section class="rules" id="draft-order">
    <h2>${STATE.season} Draft Order${provisional
      ? ` <span class="chip tie">not final yet</span>` : ""}</h2>
    <p style="color:var(--chalk-dim);font-size:13px;margin:0 0 12px;">
      The top ${o.seeded.length} from ${STATE.season-1} pick last, in reverse &mdash; the champion
      gets the final pick of the round, for their trouble. Everyone else was drawn at random.${
      provisional ? ` <b>This one is still provisional</b> &mdash; it can be re-rolled right up
      until the commissioner locks it in, so don't go planning your board around it yet.` : ""}</p>
    <table class="histtable">
      <thead><tr><th style="width:12%">Pick</th><th style="width:34%">Owner</th><th>How</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}

function payoutSection(){
  const s = payoutSummary(STATE.season);
  if(!s || (!s.p.weeks.length && !s.placesOut)) return "";
  const remaining = s.potIn - (s.p.weeklyPrize || 0) * (s.p.weeks || []).length;
  const pct = (v) => remaining > 0 ? Math.round(v / remaining * 100) + "% of what's left" : "";
  const filled = s.p.weeks.filter(w=>w.owner);
  const weeks = filled.sort((a,b)=>a.week-b.week).map(w=>
    `<tr><td>Week ${w.week}</td><td>${esc(w.owner)}</td>
      <td class="valcell">${w.score==null?"—":w.score.toFixed(2)}</td>
      <td class="valcell">${money(s.p.weeklyPrize)}</td></tr>`).join("");
  const earners = s.ledger.filter(r=>r.won>0).map(r=>
    `<tr><td>${esc(r.owner)}${r.place&&r.placePrize?` (${r.place}${["st","nd","rd"][r.place-1]||"th"})`:""}</td>
      <td class="valcell">${money(r.won)}</td></tr>`).join("");
  return `<section class="rules" id="payouts">
    <h2>${STATE.season} Pot &amp; Weekly Prizes</h2>
    <div class="prizegrid">
      <div class="prize"><small>Buy-in</small><b>${money(s.p.buyIn)}</b><span>&times; ${s.owners.length} teams = ${money(s.potIn)}</span></div>
      <div class="prize weekly"><small>Weekly top score</small><b>${money(s.p.weeklyPrize)}</b><span>&times; ${(s.p.weeks||[]).length} weeks = ${money((s.p.weeklyPrize||0)*(s.p.weeks||[]).length)}</span></div>
      <div class="prize gold"><small>1st place</small><b>${money(s.p.places[0])}</b><span>${pct(s.p.places[0])}</span></div>
      <div class="prize silver"><small>2nd place</small><b>${money(s.p.places[1])}</b><span>${pct(s.p.places[1])}</span></div>
      <div class="prize bronze"><small>3rd place</small><b>${money(s.p.places[2])}</b><span>${pct(s.p.places[2])}</span></div>
    </div>
    ${filled.length || earners ? `<div class="grid">
      ${filled.length ? `<section class="team"><h2>Weekly winners so far</h2>
        <table><tbody>${weeks}</tbody></table></section>` : ""}
      ${earners ? `<section class="team"><h2>Winnings</h2>
        <table><tbody>${earners}</tbody></table></section>` : ""}
    </div>` : `<p class="notkept">Weekly winners will show up here once the season gets rolling — check back after week one.</p>`}
  </section>`;
}


/* ---------- Draft order ----------
   League rule: the top four finishers pick LAST, in reverse — the champion has
   the final pick of round one, the runner-up the one before it, and so on.
   Everyone else is drawn at random for the remaining slots at the front.

   Two things this has to get right. The finish comes from the stored standings,
   not from points: Yahoo's standings page lists the points out of order because
   the rank is the placing after playoffs, so sorting by points would seed the
   whole thing wrong. And an owner with no standing — someone who joined for the
   coming season — can't be in the top four, so they land in the random pool. */

const TOP_N_PICK_LAST = 4;

/* Orders are kept per season and never overwritten by looking at another year.
   They used to live in a single STATE.draftOrder slot keyed by whatever season
   the app happened to be showing, so opening the tab while browsing an earlier
   year showed "no order yet" — indistinguishable from having lost it. */
/* Storage vs the baked copy. The baked copy is the published record: it yields
   only to a stored entry that is itself locked — a deliberate unlock-and-relock
   — never to absence or to an unlocked roll, which is exactly what storage loss
   followed by an accidental re-roll looks like. */
function mergedDraftOrders(stored){
  const out = Object.assign({}, stored || {});
  Object.keys(SEED_DRAFT_ORDERS).forEach(y => {
    const seed = SEED_DRAFT_ORDERS[y], cur = out[y];
    if(!cur || (seed.locked && !cur.locked)){
      out[y] = JSON.parse(JSON.stringify(seed));
    }
  });
  return out;
}

function draftOrders(){
  STATE.draftOrders = STATE.draftOrders || {};
  // Carry across the old single-slot value rather than dropping it.
  if(STATE.draftOrder && STATE.draftOrder.season && !STATE.draftOrders[STATE.draftOrder.season]){
    STATE.draftOrders[STATE.draftOrder.season] = STATE.draftOrder;
  }
  STATE.draftOrder = null;
  return STATE.draftOrders;
}
function draftOrderFor(season){ return draftOrders()[season] || null; }

function lastStandings(season){
  const prev = (STATE.seasons || {})[(season || STATE.season) - 1];
  return (prev && prev.standings) ? prev.standings.slice().sort((a,b)=>a.rank-b.rank) : [];
}

// Fisher-Yates. A sort() with a random comparator is not a shuffle — it is
// biased and, with an inconsistent comparator, not even well defined.
function shuffle(list){
  const a = list.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDraftOrder(season){
  const owners = ownersFor(season);
  const standings = lastStandings(season).filter(s => owners.includes(s.owner));
  const seeded = standings.slice(0, TOP_N_PICK_LAST).map(s => s.owner);
  const rest = owners.filter(o => !seeded.includes(o));

  const order = new Array(owners.length);
  // Champion takes the last slot, 2nd the one before it, and so on inwards.
  seeded.forEach((o, i) => { order[owners.length - 1 - i] = o; });
  const drawn = shuffle(rest);
  let k = 0;
  for(let i = 0; i < order.length; i++){ if(!order[i]) order[i] = drawn[k++]; }

  return { season: season, generatedAt: new Date().toISOString(),
           seeded: seeded, randomised: rest.length, order: order, locked: false };
}

let draftView = null;
window.setDraftView = function(y){ draftView = +y; render(); }
function draftYears(){
  const rolled = Object.keys(draftOrders()).map(Number);
  return [...new Set([...rolled, workingSeason()])].sort((a,b)=>b-a);
}

window.rollDraftOrder = async function(season){
  const existing = draftOrderFor(season);
  if(existing && existing.locked){
    uiAlert(`The ${season} draft order is locked.\n\nUnlock it first if it really needs re-rolling.`);
    return;
  }
  if(!lastStandings(season).length){
    uiAlert(`No final standings recorded for ${season - 1}, so the top four can't be placed.\n\n` +
          `Import that season first — the capture reads the standings page.`);
    return;
  }
  if(existing && !await uiConfirm(`Re-roll the ${season} draft order?\n\nThe top four keep their fixed ` +
                          `slots; everyone else is drawn again.`)) return;
  draftOrders()[season] = buildDraftOrder(season);
  saveState();
  render();
}

window.lockDraftOrder = async function(season){
  const o = draftOrderFor(season);
  if(!o) return;
  if(!await uiConfirm(`Lock the ${season} draft order?\n\nIt stops being re-rollable, is published ` +
              `to the league page as final, and syncs to your GitHub repo so no browser ` +
              `can lose it. You can unlock it again if you have to.`)) return;
  o.locked = true;
  o.lockedAt = new Date().toISOString();
  saveState();
  // The lock is what makes the order worth keeping, so it is what forces the
  // cloud copy — immediately, not on the debounce.
  syncToCloud(true);
  render();
}
window.unlockDraftOrder = async function(season){
  const o = draftOrderFor(season);
  if(!o) return;
  if(!await uiConfirm(`Unlock the ${season} draft order so it can be re-rolled?`)) return;
  o.locked = false;
  saveState();
  syncToCloud(true);   // an unlock is as deliberate as a lock; the cloud must know
  render();
}
window.clearDraftOrder = async function(season){
  const o = draftOrderFor(season);
  if(o && o.locked){ uiAlert(`The ${season} order is locked. Unlock it first.`); return; }
  if(!await uiConfirm(`Clear the ${season} draft order?`)) return;
  delete draftOrders()[season];
  saveState();
  render();
}

function ordinal(n){ return n + (["st","nd","rd"][n-1] || "th"); }

/* Draft night and the keeper deadline. Both publish to the league page as live

            [browserTz()].filter(z => ["America/Los_Angeles","America/Denver","America/Phoenix","America/Chicago","America/New_York","America/Anchorage","Pacific/Honolulu","Europe/London"].indexOf(z) < 0))

function renderDraftOrderPanel(){
  const years = draftYears();
  const season = (draftView && years.includes(draftView)) ? draftView : workingSeason();
  const standings = lastStandings(season);
  const prevYear = season - 1;
  const current = draftOrderFor(season);
  const ro = season !== workingSeason();

  const picker = `<div class="toolbar" style="margin-bottom:14px;">
    ${years.map(y=>{
      const o = draftOrderFor(y);
      return `<button class="btn ${y===season?"":"secondary"} small" onclick="setDraftView(${y})">${y}${
        o && o.locked ? " &#128274;" : ""}</button>`;
    }).join("")}
    ${ro?`<span class="badge" style="margin-left:8px;">${season} is history &mdash; view only</span>`:""}
  </div>`;

    return picker + renderEventsCard(season, ro) + `<div class="grid-owner">
      <h4>${season} draft order</h4>
      <div class="import-help">No final standings stored for ${prevYear}, so the top four
        can't be placed. Import ${prevYear} on the Import tab — the capture reads the
        standings page along with everything else.</div>
    </div>`;
  }

  const finishLine = standings.slice(0, TOP_N_PICK_LAST).map((s,i)=>
    `<span class="chip"${ownersFor(season).includes(s.owner)?'':' style="opacity:.45"'} title="${esc(s.team)}">${
      ordinal(i+1)} ${esc(s.owner)}</span>`).join(" ");

  const rows = current ? current.order.map((o,i)=>{
    const pick = i + 1;
    const fixed = current.seeded.includes(o);

            : `<span class="pnote">drawn at random</span>`}</td>

  const locked = !!(current && current.locked);
  const controls = (ro || isDataOnly()) ? "" : `<div class="toolbar" style="margin-bottom:${current?"10px":"0"};">
      ${locked
        ? `<span class="badge" style="background:rgba(95,185,138,0.18);color:var(--ok);">&#128274; Locked &mdash; final</span>
           <button class="btn secondary small" onclick="unlockDraftOrder(${season})">Unlock</button>`
        : `<button class="btn" onclick="rollDraftOrder(${season})">${
             current?"&#8635; Re-roll":"&#9856; Set"} ${season} draft order</button>
           ${current?`<button class="btn" onclick="lockDraftOrder(${season})">&#128274; Lock it in</button>
                      <button class="btn secondary small" onclick="clearDraftOrder(${season})">Clear</button>`:""}`}
    </div>`;

  return picker + renderEventsCard(season, ro) + `<div class="grid-owner">
    <h4>${season} draft order${locked?" &mdash; final":""}</h4>
    <div class="import-help">
      The top four from ${prevYear} pick last, in reverse — the champion has the final pick
      of the round. Everyone else is drawn at random for the slots in front of them.
      ${standings.length?`<br><br>Top four in ${prevYear}: ${finishLine}`:""}
      ${locked?`<br><br><b>Locked.</b> This is the order the league sees. Re-rolling is blocked
        until it is unlocked.`:(current?`<br><br>Rolled but not locked — it can still be re-rolled.
        Lock it when it is settled.`:"")}
    </div>
    ${controls}
    ${current ? `<table class="previewtable">
        <thead><tr><th>Pick</th><th>Owner</th><th>How</th></tr></thead>
        <tbody>${rows}</tbody></table>
      <div class="pnote" style="margin-top:8px;">Rolled ${esc(current.generatedAt.slice(0,16).replace("T"," "))}
        · ${current.seeded.length} fixed by finish, ${current.randomised} drawn${
        current.lockedAt?` · locked ${esc(current.lockedAt.slice(0,16).replace("T"," "))}`:""}.</div>` : ""}
  </div>`;
}

/* ---------- Season capture import ----------
   Takes a whs-<year>-capture.json from the capture bookmarklet, turns it into a
   season in the store, and re-derives everything. This replaces
   ingest_capture.py plus the whole scripts/ pipeline.

   The one thing a capture can't settle is which Yahoo manager is which owner.
   Yahoo shows display names ("Raj M", "Bob", "frank t") that don't match the
   names used here, and nicknames turn over most years. So that becomes a set of
   dropdowns rather than an edit to a Python file. */

let pendingCapture = null;     // { capture, mapping:{team->owner}, seasonEnd }

// Yahoo display name -> owner. Learned as you confirm, so it only ever has to
// be answered once per manager.
/* First names and short Yahoo handles only. A full "First Last" display name
   belongs nowhere near a file that can be pushed to a repo — the sync payload
   already strips the learned alias map for exactly this reason, and baking one
   into the source would have quietly undone that. Any display name missing
   here is picked once from a dropdown on import and remembered locally. */
const SEED_MANAGER_ALIASES = {
  "raj m":"Raj", "bob":"Anish", "frank t":"Frank",
  "joseph":"Joey", "phil":"Phil", "jay":"Jay", "yi":"Yi", "neil":"Neil",
  "vyas":"Vyas", "eric":"Eric", "nikunj":"Nikunj", "anish":"Anish", "raj":"Raj", "frank":"Frank"
};

function managerAliases(){
  return Object.assign({}, SEED_MANAGER_ALIASES, STATE.managerAliases || {});
}
function guessOwner(displayName){
  const a = managerAliases();
  const k = String(displayName||"").trim().toLowerCase();
  if(a[k]) return a[k];
  // Fall back to a first-name match against people already in the league.
  const first = k.split(/\s+/)[0];
  const known = new Set();
  Object.values(STATE.leagueMembers || {}).forEach(list => list.forEach(o => known.add(o)));
  for(const o of known){ if(o.toLowerCase() === first) return o; }
  return "";
}

window.handleCaptureFile = function(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let cap;
    try{ cap = JSON.parse(r.result); }
    catch(e){ uiAlert("That file isn't valid JSON.\n\n" + e.message); return; }
    const problems = [];
    if(!cap.season) problems.push("no season");
    if(!Array.isArray(cap.draft) || !cap.draft.length) problems.push("no draft picks");
    if(!Array.isArray(cap.rosters) || !cap.rosters.length) problems.push("no final rosters");
    if(problems.length){
      uiAlert("That doesn't look like a season capture (" + problems.join(", ") + ").\n\n" +
            "Use the “Capture WHS season” bookmark on a Yahoo league page.");
      return;
    }
    const mapping = {};
    (cap.managers || []).forEach(m => { mapping[m.team] = guessOwner(m.manager); });
    // Yahoo clips long nicknames on some pages ("year of the bruins" becomes
    // "year of the"), so a roster or draft label may be a prefix of a name we
    // already have. Only ask about a team that matches nothing — otherwise the
    // same owner gets asked for two or three times.
    const core = (n) => String(n||"").replace(/\s*(\.\.\.|…)\s*$/, "").trim();
    const prefixKnown = (name) => Object.keys(mapping).some(k => {
      const a = core(k), b = core(name);
      return a === b || a.startsWith(b) || b.startsWith(a);
    });
    (cap.rosters || []).forEach(t => {
      if(!prefixKnown(t.team)) mapping[t.team] = guessOwner(t.team);
    });
    pendingCapture = { capture: cap, mapping: mapping, seasonEnd: cap.seasonEnd || "" };
    render();
  };
  r.readAsText(f);
}

window.setCaptureOwner = function(team, owner){
  if(!pendingCapture) return;
  pendingCapture.mapping[team] = owner;
  render();
}
window.setCaptureSeasonEnd = function(v){ if(pendingCapture){ pendingCapture.seasonEnd = v; } }
window.cancelCapture = function(){ pendingCapture = null; render(); }

window.applyCapture = async function(){
  if(!pendingCapture) return;
  const { capture: cap, mapping, seasonEnd } = pendingCapture;
  const year = String(cap.season);

  const unmapped = Object.keys(mapping).filter(t => !mapping[t]);
  if(unmapped.length){ uiAlert("Still need an owner for: " + unmapped.join(", ")); return; }
  if(!seasonEnd){ uiAlert("The season-end date is needed — rule 8 counts back four weeks from it."); return; }

  if(STATE.seasons[year] && !await uiConfirm(
      `${year} is already stored. Replace it with this capture and recompute?`)) return;

  // teamMap keyed by the clipped prefix the draft page uses, plus the full name.
  const teamMap = {};
  Object.keys(mapping).forEach(t => { teamMap[t] = mapping[t]; });
  // The draft page truncates long nicknames and marks it with an ellipsis
  // ("year of the ...", "Koo’s your..."), while the Managers and roster pages
  // give the full name. Strip the marker before comparing, then match on the
  // visible prefix. Without this every clipped team fails to resolve.
  const teamCore = (name) => String(name||"").replace(/\s*(\.\.\.|…)\s*$/, "").trim();
  const resolveTeam = (name) => {
    const t = teamCore(name);
    if(!t) return null;
    if(teamMap[t]) return teamMap[t];
    const hits = Object.keys(teamMap).filter(k => {
      const c = teamCore(k);
      return c === t || c.startsWith(t) || t.startsWith(c);
    });
    const owners = [...new Set(hits.map(k => teamMap[k]))];
    // Two nicknames sharing a prefix would make this ambiguous. Refuse rather
    // than pick one — that is a wrong owner on every one of their players.
    return owners.length === 1 ? owners[0] : null;
  };

  const unresolved = new Set();
  const draft = cap.draft.map(p => {
    const owner = resolveTeam(p.team);
    if(!owner) unresolved.add(p.team);
    return { round: p.round, player: p.player, team: p.team, owner: owner,
             keeperCost: p.isKeeper ? p.round : null,
             yahooSalary: p.keeperSalaryTooltip ? +p.keeperSalaryTooltip : null };
  });
  const rosters = {};
  cap.rosters.forEach(t => {
    const owner = resolveTeam(t.team);
    if(!owner){ unresolved.add(t.team); return; }
    rosters[owner] = (rosters[owner] || []).concat(
      t.players.map(pl => pl.name + (String(pl.playerId||"").startsWith("DEF:") ? " DEF" : "")));
  });
  const transactions = (cap.transactions || []).map(t => ({
    date: t.date, team: t.team, player: t.player, owner: resolveTeam(t.team)
  })).filter(t => t.owner);

  if(unresolved.size){
    uiAlert("Couldn't match these Yahoo team names to an owner:\n  " +
          [...unresolved].join("\n  ") +
          "\n\nNothing was imported.");
    return;
  }

  const standings = (cap.standings || []).map(s => ({
    rank: s.rank, team: s.team, owner: resolveTeam(s.team)
  })).filter(s => s.owner).sort((a,b)=>a.rank-b.rank);

  STATE.seasons[year] = {
    standings: standings,
    leagueId: String(cap.leagueId || ""),
    rounds: Math.max(...draft.map(p => p.round)),
    source: `https://football.fantasysports.yahoo.com/${year}/f1/${cap.leagueId}/draftresults`,
    capturedAt: cap.capturedAt || null,
    teamMap: teamMap,
    seasonEnd: seasonEnd,
    draft: draft,
    rosters: rosters,
    transactions: transactions,
    zeroPointPlayers: (cap.points || []).filter(p => p.points === 0).map(p => p.name)
  };

  // Remember any manager display names that were resolved by hand.
  STATE.managerAliases = STATE.managerAliases || {};
  (cap.managers || []).forEach(m => {
    const owner = mapping[m.team];
    if(owner) STATE.managerAliases[String(m.manager).trim().toLowerCase()] = owner;
  });

  // Yahoo ids from the capture, so the fill bookmarklet can match on id.
  STATE.yahooIds = STATE.yahooIds || {};
  cap.rosters.forEach(t => t.players.forEach(pl => {
    if(pl.playerId && !String(pl.playerId).startsWith("DEF:")){
      STATE.yahooIds[deriveKey(pl.name)] = String(pl.playerId);
    }
  }));

  // Positions, where the capture found them.
  STATE.positions = STATE.positions || {};
  Object.keys(cap.positions || {}).forEach(n => {
    STATE.positions[deriveKey(n)] = cap.positions[n];
  });
  cap.rosters.forEach(t => t.players.forEach(pl => {
    if(pl.position) STATE.positions[deriveKey(pl.name)] = pl.position;
  }));

  // The season we now compute for is the one after the season just imported.
  STATE.season = cap.season + 1;
  STATE.leagueMembers = STATE.leagueMembers || {};
  if(!STATE.leagueMembers[STATE.season]){
    STATE.leagueMembers[STATE.season] = [...new Set(Object.values(mapping))].sort();
  }

  const res = recomputeFromSeasons();
  pendingCapture = null;
  await saveState();
  render();

  const elig = res.players.filter(p => getStatus(p, STATE.season).eligible).length;
  uiAlert(`Imported ${year} and recomputed ${STATE.season}.\n\n` +
        `${res.players.length} players carried into ${STATE.season}, ${elig} keeper-eligible.\n` +
        `${draft.length} draft picks, ${transactions.length} adds, ` +
        `${Object.keys(rosters).length} rosters.\n` +
        (res.anomalies.length
          ? `\n${res.anomalies.length} thing(s) worth a look:\n  ` + res.anomalies.slice(0,5).join("\n  ")
          : `\nNo anomalies — every keeper traced back to a prior final roster.`) +
        `\n\nNext: Keepers → “${STATE.season} keeper costs for Yahoo”.`);
}

function renderCapturePanel(){
  if(!pendingCapture){
    return `<div class="grid-owner">
      <h4>Import a season from Yahoo</h4>
      <div class="import-help">
        Click <b>&#128229; Capture WHS season</b> on any Yahoo page of the season that just
        wrapped, then drop the downloaded <span class="mono">whs-&lt;year&gt;-capture.json</span>
        file here. The app reads the draft, final rosters, transactions, managers, and the
        season-end date, then recomputes every keeper value on its own. Nothing else to run.
      </div>
      <input type="file" accept=".json,application/json" onchange="handleCaptureFile(event)">
    </div>`;
  }

  const { capture: cap, mapping, seasonEnd } = pendingCapture;
  const owners = [...new Set([].concat(
    ...Object.values(STATE.leagueMembers || {}),
    Object.values(mapping).filter(Boolean)))].sort();

  const rows = (cap.managers && cap.managers.length ? cap.managers : Object.keys(mapping).map(t=>({team:t,manager:"—"})))
    .map(m => {
      const cur = mapping[m.team] || "";
      const opts = ['<option value="">— pick —</option>']
        .concat(owners.map(o => `<option value="${esc(o)}" ${o===cur?"selected":""}>${esc(o)}</option>`))
        .join("");
      return `<tr>
        <td>${esc(m.team)}</td>
        <td class="mono">${esc(m.manager)}</td>
        <td><select onchange="setCaptureOwner(${esc(JSON.stringify(m.team))}, this.value)">${opts}</select></td>
        <td class="mono ${cur?'live':'zero'}">${cur ? "ok" : "needs an owner"}</td>
      </tr>`;
    }).join("");

  const missing = Object.keys(mapping).filter(t=>!mapping[t]).length;
  const rostered = (cap.rosters||[]).reduce((s,t)=>s+t.players.length,0);

  return `<div class="grid-owner">
    <h4>Import ${cap.season} — check the managers</h4>
    <div class="import-help">
      Captured ${cap.capturedAt ? esc(cap.capturedAt.slice(0,10)) : "recently"}:
      <b>${(cap.draft||[]).length}</b> draft picks,
      <b>${rostered}</b> players on <b>${(cap.rosters||[]).length}</b> final rosters,
      <b>${(cap.transactions||[]).length}</b> adds.
      <br><br>
      Yahoo's manager names don't always match the names used here, and nicknames change
      most years, so this is the one thing the app genuinely can't work out on its own.
      Anything already recognized gets filled in for you — confirm it and it's remembered
      for next time.
    </div>
    <table>
      <thead><tr><th>Yahoo team</th><th>Yahoo manager</th><th>Owner</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="addform" style="grid-template-columns:auto 1fr; margin-top:12px;">
      <label style="align-self:center;">Season ended</label>
      <input type="date" value="${esc(seasonEnd)}" data-commit="setCaptureSeasonEnd(this.value)">
    </div>
    <div class="import-help">Rule 8 counts back four weeks from this date. Read from Yahoo's
      final week; change it only if that's wrong.</div>
    <div class="toolbar">
      <button class="btn" onclick="applyCapture()" ${missing?'disabled style="opacity:.5;cursor:not-allowed;"':''}>
        Import ${cap.season} and recompute ${cap.season+1}</button>
      <button class="btn secondary" onclick="cancelCapture()">Cancel</button>
    </div>
    ${missing ? `<div class="import-help" style="color:var(--danger);">${missing} team(s) still need an owner.</div>` : ""}
  </div>`;
}

/* ---------- Keeper costs for the Yahoo fill bookmarklet ---------- */

// Must stay identical to norm() in scripts/keeper_costs.py and in
// tools/yahoo-keeper-fill.js. Same NFKD pass, same DEF strip, same repeated
// suffix strip, same [^a-z] squeeze. If one changes, change all three.
function normPlayerKey(s){
  s = (s||"").normalize("NFKD").trim();
  s = s.replace(/\s*DEF$/i, "");
  let prev = null;
  while(prev !== s){ prev = s; s = s.replace(/\s+(Jr\.?|Sr\.?|II|III|IV|V)$/i, "").trim(); }
  return s.toLowerCase().replace(/[^a-z]/g, "");
}

const YAHOO_DEFAULT_SALARY = 8;

window.exportKeeperCostsJSON = function(){
  const season = STATE.season;
  const byName = {}, byId = {};
  const clashes = [];

  STATE.players.forEach(p => {
    const st = getStatus(p, season);
    // Yahoo wants a number in every meaningful box: the keeper cost for anyone
    // who can be kept, and a literal 0 for anyone who can't. A blank would fall
    // through to Default Salary and quietly make an ineligible player keepable.
    const cost = st.eligible ? st.cost : 0;
    const key = normPlayerKey(p.name);
    if(Object.prototype.hasOwnProperty.call(byName, key) && byName[key] !== cost){
      clashes.push(p.name);
    }
    byName[key] = cost;
    if(p.yahooId) byId[String(p.yahooId)] = cost;
  });

  if(clashes.length){
    uiAlert("Two players share a normalised name, so matching would be ambiguous:\n\n  " +
          clashes.join("\n  ") +
          "\n\nNothing was exported. This needs sorting out first.");
    return;
  }

  const payload = {
    season: season,
    default: YAHOO_DEFAULT_SALARY,
    generated: new Date().toISOString(),
    byId: byId,
    byName: byName
  };

  const blob = new Blob([JSON.stringify(payload, null, 1)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = season + "-keeper-costs.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  const total = Object.keys(byName).length;
  const zeros = Object.values(byName).filter(v => v === 0).length;
  const typed = Object.values(byName).filter(v => v !== YAHOO_DEFAULT_SALARY).length;
  uiAlert(`Saved ${season}-keeper-costs.json\n\n` +
        `${total} players — ${typed} need a value in Yahoo, ${zeros} of those are 0 ` +
        `(can't be kept).\nThe other ${total - typed} are ${YAHOO_DEFAULT_SALARY}s and stay blank.\n\n` +
        `Now open Yahoo's Set Keeper Salaries page, click the "Fill keeper salaries" ` +
        `bookmark, and pick this file.`);
}

/* ---------- Bulk Import ---------- */
let importMode = "draft"; // "draft" or "waiver"
let importPreview = [];

window.setImportMode = function(mode){
  importMode = mode;
  importPreview = [];
  render();
}

function fuzzyFindOwner(raw){
  const clean = raw.trim().toLowerCase();
  return OWNERS.find(o => o.toLowerCase() === clean)
    || OWNERS.find(o => o.toLowerCase().startsWith(clean))
    || OWNERS.find(o => clean.startsWith(o.toLowerCase()))
    || null;
}

function parseRoundToken(tok){
  if(tok == null) return null;
  const t = String(tok).trim().toLowerCase();
  if(t === "" ) return null;
  if(t.includes("waiver") || t.includes("fa") || t === "8+" ) return 8;
  const n = parseInt(t.replace(/[^0-9]/g,""), 10);
  if(isNaN(n)) return null;
  return Math.min(8, Math.max(1, n));
}

// Splits a pasted line on tabs, or falls back to commas
function splitLine(line){
  if(line.indexOf(String.fromCharCode(9)) !== -1) return line.split(String.fromCharCode(9)).map(s=>s.trim());
  return line.split(",").map(s=>s.trim());
}

// Shared classification: given raw {rawOwner, owner, name, round}, decide new/update/reactivate/skip
function classifyRows(rows){
  return rows.map(r=>{
    if(!r.owner){
      return { ...r, action:"skip", reason:"Team/owner not recognized: " + r.rawOwner };
    }
    if(!r.name){
      return { ...r, action:"skip", reason:"Missing player name" };
    }
    const sameOwnerMatch = STATE.players.find(p => p.owner===r.owner && p.name.toLowerCase()===r.name.toLowerCase());
    if(sameOwnerMatch){
      return { ...r, action:"update", reason: "Round " + sameOwnerMatch.draftRound + " -> " + (r.round!=null?r.round:"?") , existingId: sameOwnerMatch.id };
    }
    const droppedMatch = STATE.players.find(p => !p.owner && p.name.toLowerCase()===r.name.toLowerCase());
    if(droppedMatch){
      return { ...r, action:"reactivate", reason: "Was dropped — history preserved (Rd " + droppedMatch.draftRound + ", " + (droppedMatch.keptSeasons||[]).length + " kept yrs), just reassigning to " + r.owner, existingId: droppedMatch.id };
    }
    const elsewhereMatch = STATE.players.find(p => p.owner && p.owner!==r.owner && p.name.toLowerCase()===r.name.toLowerCase());
    if(elsewhereMatch){
      return { ...r, action:"reactivate", reason: "Currently listed under " + elsewhereMatch.owner + " — trade detected, moving to " + r.owner + " with history intact", existingId: elsewhereMatch.id };
    }
    return { ...r, action: r.round!=null ? "new" : "skip", reason: r.round!=null ? "Will be added" : "No round given" };
  });
}

window.parseImportPreview = function(){
  const text = document.getElementById("importtext").value;
  const lines = text.split(String.fromCharCode(10)).map(l=>l.trim()).filter(Boolean);
  const rows = [];
  lines.forEach(line=>{
    const parts = splitLine(line);
    if(parts.length < 2) return;
    let owner, name, round;
    if(importMode === "draft"){
      // Expect: Owner, Player, Round   (round col optional per-row order; try to detect)
      if(parts.length >= 3){
        owner = parts[0]; name = parts[1]; round = parseRoundToken(parts[2]);
      } else {
        owner = parts[0]; name = parts[1]; round = null;
      }
    } else {
      // Waiver mode: Owner, Player -> always round 8
      owner = parts[0]; name = parts[1]; round = 8;
    }
    const matchedOwner = fuzzyFindOwner(owner);
    rows.push({ rawOwner: owner, owner: matchedOwner, name, round });
  });
  importPreview = classifyRows(rows);
  render();
}

/* ---------- File upload: parse Yahoo's raw "Draft Result by Team" export ---------- */
let pendingFileRows = null;   // raw {teamRaw, name, round} rows awaiting team-name resolution
let unresolvedTeams = [];

function cleanPastedName(s){
  // Strip Yahoo's watchlist-star / nbsp characters that ride along with pasted names
  return String(s).replace(/[\u00A0\uE000-\uF8FF]/g, "").trim();
}

window.handleDraftFileUpload = function(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array"});
      const sheetName = wb.SheetNames.find(n => /team/i.test(n)) || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const rows2d = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null});
      const parsed = [];
      let currentTeam = null;
      rows2d.forEach(row=>{
        const a = row[0], b = row[1], c = row[2];
        const aEmpty = (a===null || a==="");
        const bEmpty = (b===null || b==="");
        const cEmpty = (c===null || c==="");
        if(!aEmpty && bEmpty && cEmpty){
          currentTeam = cleanPastedName(a);
        } else if(currentTeam && !aEmpty && !cEmpty && !isNaN(parseInt(a,10))){
          const round = Math.min(8, Math.max(1, parseInt(a,10)));
          const name = cleanPastedName(c);
          if(name) parsed.push({ teamRaw: currentTeam, name, round });
        }
      });
      if(parsed.length===0){
        uiAlert("Couldn't find any draft picks in that file. Expected Yahoo's \"Draft Result by Team\" sheet shape — team name on its own row, then rows of round/pick/player beneath it.");
        return;
      }
      pendingFileRows = parsed;
      const teams = [...new Set(parsed.map(p=>p.teamRaw))];
      unresolvedTeams = teams.filter(t => !STATE.teamNameMap[t] && !fuzzyFindOwner(t));
      render();
    }catch(err){
      uiAlert("Couldn't read that file: " + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

window.setTeamMapping = function(teamRaw, owner){
  if(!owner) return;
  STATE.teamNameMap[teamRaw] = owner;
  saveState();
  unresolvedTeams = unresolvedTeams.filter(t=>t!==teamRaw);
  render();
}

window.editTeamMapping = function(teamRaw){
  const current = STATE.teamNameMap[teamRaw] || "";
  const choice = prompt("Map fantasy team \"" + teamRaw + "\" to which owner?\n(" + OWNERS.join(", ") + ")", current);
  if(choice === null) return;
  const matched = fuzzyFindOwner(choice.trim());
  if(!matched){
    uiAlert("\"" + choice + "\" doesn't match any of: " + OWNERS.join(", "));
    return;
  }
  STATE.teamNameMap[teamRaw] = matched;
  saveState();
  render();
}

window.addTeamMapping = function(){
  const nameEl = document.getElementById("newteamname");
  const ownerEl = document.getElementById("newteamowner");
  const name = nameEl.value.trim();
  if(!name || !ownerEl.value) return;
  STATE.teamNameMap[name] = ownerEl.value;
  nameEl.value = "";
  saveState();
  render();
}

window.deleteTeamMapping = function(teamRaw){
  delete STATE.teamNameMap[teamRaw];
  saveState();
  render();
}

window.resolveFileImport = function(){
  if(!pendingFileRows) return;
  const rows = pendingFileRows.map(p=>{
    const owner = STATE.teamNameMap[p.teamRaw] || fuzzyFindOwner(p.teamRaw);
    return { rawOwner: p.teamRaw, owner, name: p.name, round: p.round };
  });
  importPreview = classifyRows(rows);
  pendingFileRows = null;
  render();
}

window.applyImportPreview = function(){
  let added=0, updated=0, reactivated=0;
  importPreview.forEach(r=>{
    if(r.action==="update" && r.round!=null){
      const p = STATE.players.find(x=>x.id===r.existingId);
      if(p){ p.draftRound = r.round; updated++; }
    } else if(r.action==="reactivate"){
      const p = STATE.players.find(x=>x.id===r.existingId);
      if(p){ p.owner = r.owner; reactivated++; }
    } else if(r.action==="new" && r.round!=null){
      STATE.players.push({
        id: uid(), name: r.name, owner: r.owner, draftRound: r.round, keptSeasons: [],
        ruleIneligible:false, ruleIneligibleReason:null, note:"", keepThisYear:false, assignedRound:null
      });
      added++;
    }
  });
  importPreview = [];
  const ta = document.getElementById("importtext");
  if(ta) ta.value = "";
  const fi = document.getElementById("importfile");
  if(fi) fi.value = "";
  saveState();
  render();
  uiAlert("Import complete: " + added + " new, " + updated + " updated, " + reactivated + " reactivated (history preserved).");
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* Every season this player has been owned, in order: the year he was drafted,
   then each year he was kept. Three entries means the 3-year cap is spent.
   Entirely derived — the draft record and the finalized keeper years are the
   only inputs, so there is nothing here to edit. */
function ownedSeasons(player){
  const kept = (player.keptSeasons||[]).slice().sort((a,b)=>a.year-b.year);
  const out = [];
  if(player.draftYear != null){
    // The actual round he went in — NOT his keeper cost. A 12th-round pick shows
    // 12 here and costs 8 to keep; those are different facts.
    const drafted = player.draftedRound != null;
    out.push({ year: player.draftYear, kind: drafted ? "drafted" : "added",
               round: drafted ? player.draftedRound : null,
               owner: kept.length ? kept[0].owner : player.owner });
  }
  kept.forEach(k => out.push({ year: k.year, kind: "kept", round: k.cost, owner: k.owner }));
  return out;
}

function ownedSeasonsCell(player, season){
  season = season || STATE.season;
  const seasons = ownedSeasons(player);
  if(!seasons.length){
    return '<span class="pnote">no draft record yet</span>';
  }
  // One season per line, oldest first — the sequence is the point, and a single
  // wrapped run of chips is hard to read it off.
  const chips = seasons
    .slice()
    .sort((a,b) => (a.year == null ? 0 : a.year) - (b.year == null ? 0 : b.year))
    .map(s=>{
      const moved = s.owner && player.owner && s.owner !== player.owner;
      const head = s.year != null ? `${s.year} · ${s.kind}` : s.kind;
      const rd = s.round != null ? "Rd" + s.round
               : (s.kind === "added" ? "FA/waivers" : "Rd?");
      const tip = s.owner ? `${s.kind === "drafted" ? "Drafted" : s.kind === "added" ? "Added" : "Kept"} by ${esc(s.owner)}`
                          : "Owner not recorded";
      return `<div style="margin:0 0 3px 0;"><span class="chip"`
           + `${moved ? ' style="border-color:var(--gold-dim);color:var(--gold);"' : ''} title="${tip}">`
           + `${head} ${rd}${moved ? " · " + esc(s.owner) : ""}</span></div>`;
    }).join("");

  // Years spent against the cap, scoped to the current owner (a trade resets it).
  const used = Math.min(3, getCostForSeason(player, season).ownerCount + 1);
  const spent = used >= 3;
  return chips + `<div class="pnote" style="font-style:normal;${spent ? "color:var(--danger);" : ""}">`
       + `${used} of 3 years with ${esc(player.owner || "—")}${spent ? " — cap reached" : ""}</div>`;
}

function renderBanner(){
  // A past season carries its own banner describing what it is. This one is
  // about the working set and would be flatly wrong over the archive.
  if(!isWorkingSeason()) return "";
  const rostered = STATE.players.filter(p=>p.owner);
  const needRound = rostered.filter(p=>p.draftRound == null).length;
  const logged = STATE.players.filter(p=>(p.keptSeasons||[]).length).length;
  const behind = seasonsBehind();
  const stale = behind ? `<div class="tiewarn" style="margin-bottom:12px;">
    <b>It's ${calendarSeason()} and these are still ${STATE.season} values.</b>
    ${behind === 1 ? `The ${workingSeason()-1} season finished and hasn't been imported yet.`
                   : `${behind} seasons have gone by without an import.`}
    Run the capture on Yahoo and bring ${workingSeason()-1} in &mdash; everything reprices to
    ${calendarSeason()} the moment you do.</div>` : "";
  return stale + `<div class="banner">
    <b>Rosters are the real end-of-season finals</b> — only these players can be kept, so this is the pool every
    value gets calculated from. Hit <span class="mono">&#8681;</span> to drop someone; they land in
    <b>Free Agents</b> with their history intact, in case you want them back later.
    ${needRound ? `<br><br><b>${needRound} of ${rostered.length} players still need a draft round</b>, so they show
      a cost of 0 and are marked <span class="badge ineligible">needs round</span> for now. A round is the base
      keeper value — without it there's nothing to calculate.` : ""}
    <br><br><b>${logged} player${logged===1?" carries":"s carry"} keeper history into ${STATE.season}.</b>
    Every value here comes straight from Yahoo's own records — ten seasons of drafts and rosters, the keeper
    flag on every pick, the transaction log for the 4-week cutoff, and season totals for the played check.
    Nothing's typed in by hand, and there's nothing to fudge.
  </div>`;
}

/* ctx.live  — the working season: checkboxes, tie-breaks, drop/delete.
   ctx.season — which season's costs to show; also fixes the draft-round column
                to season-1, so a past year reads from its own standpoint.
   ctx.kept   — for a past season, the deriveKeys actually kept that year, so
                the last column reports what happened instead of offering a
                choice that was made years ago. */
function playerRow(p, ctx){
  ctx = ctx || { season: STATE.season, live: true };
  const season = ctx.season;
  const st = getStatus(p, season);
  const costDisplay = st.eligible ? st.cost : "0 · Ineligible";
  const costClass = st.eligible ? "live" : "zero";

  if(!ctx.live){
    const lastRdH = p.lastDraftRound != null ? p.lastDraftRound
                  : (p.draftYear === season - 1 && p.draftedRound != null ? p.draftedRound : null);
    const wasKept = ctx.kept && ctx.kept.has(deriveKey(p.name));
    const cls = wasKept ? ' class="iskeeper"' : (st.eligible ? "" : ' class="locked"');
    return `<tr${cls}>
      <td>
        <div class="pname">${esc(p.name)}${positionTag(p.name)}</div>
        ${p.note ? `<div class="pnote">${esc(p.note)}</div>` : ""}
      </td>
      <td class="mono" style="font-size:15px;${lastRdH == null ? "color:var(--chalk-dim);" : ""}"
          title="${lastRdH == null ? "Not in the " + (season-1) + " draft — picked up in-season"
                                  : "Round occupied in the " + (season-1) + " draft"}">
        ${lastRdH != null ? lastRdH : "—"}
      </td>
      <td>${ownedSeasonsCell(p, season)}</td>
      <td>
        <span class="cost mono ${costClass}">${costDisplay}</span>
        ${!st.eligible ? `<div><span class="badge ineligible">${esc(st.reason)}</span></div>` : ""}
      </td>
      <td style="text-align:center;">
        ${wasKept ? `<span class="mono live">kept</span>`
                  : `<span class="pnote">${st.eligible ? "not kept" : "—"}</span>`}
      </td>
      <td></td>
    </tr>`;
  }
  // Owned Seasons — the drafted → kept → kept pattern, derived from the draft
  // record plus every finalized keeper year. Read-only by design: it is the
  // output of the rules, not somewhere to type.
  const keptCell = ownedSeasonsCell(p);
  // The round he actually occupied in last season's draft. Read-only: it is
  // imported fact, and typing over it would only desync the app from Yahoo.
  const lastRd = p.lastDraftRound != null ? p.lastDraftRound
               : (p.draftYear === STATE.season - 1 && p.draftedRound != null ? p.draftedRound : null);

  // Only surfaces once he's checked AND collides with another keeper on cost.
  // Options are the cost itself and one round earlier per extra tied player —
  // nothing else is a legal slot.
  let tieSelect = "";
  const grp = tieGroupFor(p);
  if(grp){
    const opts = tieOptions(grp.cost, grp.players.length);
    const taken = grp.players.filter(x => x.id !== p.id)
                             .map(x => x.assignedRound).filter(r => r != null);
    const others = grp.players.filter(x => x.id !== p.id).map(x => x.name).join(", ");
    tieSelect = `<div style="margin-top:5px;">
      <select onchange="setAssignedRound('${p.id}', this.value)"
              style="${p.assignedRound == null ? 'border-color:var(--danger);' : 'border-color:var(--ok);'}"
              title="Also costs ${grp.cost}: ${esc(others)}. Two keepers can't share a round — pick which one this is.">
        <option value="">pick rd…</option>
        ${opts.map(r=>`<option value="${r}" ${p.assignedRound===r?'selected':''} ${taken.includes(r)?'disabled':''}>Rd ${r}</option>`).join("")}
      </select></div>`;
  }
  // Checked to keep reads the same as a keeper does everywhere else in the app.
  const liveCls = p.keepThisYear && st.eligible ? ' class="iskeeper"'
                : (st.eligible ? "" : ' class="locked"');
  return `<tr${liveCls}>
    <td>
      <div class="pname">${esc(p.name)}${positionTag(p.name)}</div>
      ${p.note ? `<div class="pnote" onclick="editNote('${p.id}')" style="cursor:pointer">${esc(p.note)} ✎</div>` : `<div class="pnote" onclick="editNote('${p.id}')" style="cursor:pointer;opacity:.4">+ add note</div>`}
    </td>
    <td class="mono" style="font-size:15px;${lastRd == null ? "color:var(--chalk-dim);" : ""}"
        title="${lastRd == null ? "Not in the " + (STATE.season-1) + " draft — picked up in-season" : "Round occupied in the " + (STATE.season-1) + " draft"}">
      ${lastRd != null ? lastRd : "—"}
    </td>
    <td>${keptCell}</td>
    <td>
      <span class="cost mono ${costClass}">${costDisplay}</span>
      ${!st.eligible ? `<div><span class="badge ineligible">${esc(st.reason)}</span></div>` : ""}
    </td>
    <td style="text-align:center;">
      <input type="checkbox" ${p.keepThisYear?'checked':''} ${st.eligible ? "" : "disabled"} onchange="toggleKeep('${p.id}')"
        title="${st.eligible ? "Mark as kept for " + STATE.season + (isDataOnly() ? ", then finalize from the desktop" : ", then Finalize to lock it in") : "Ineligible — " + esc(st.reason)}">
      ${tieSelect}
    </td>
    <td><button class="rowbtn" onclick="dropPlayer('${p.id}')" title="Drop from roster (keeps history for later)">&#8681;</button> <button class="rowbtn" onclick="removePlayer('${p.id}')" title="Delete entirely (data-entry mistake)">🗑</button></td>
  </tr>`;
}

function renderOwnerCard(owner, ctx, pool){
  ctx = ctx || { season: STATE.season, live: true };
  const all = pool || STATE.players;
  let players = all.filter(p=>p.owner===owner);
  const total = players.length;
  if(searchQuery){
    if(!owner.toLowerCase().includes(searchQuery)){
      players = players.filter(p=>p.name.toLowerCase().includes(searchQuery));
      if(players.length===0) return "";
    }
  }
  const isOpen = openOwners.has(owner) || (searchQuery && players.length>0 && players.length < total);
  const season = ctx.season;

  let meta, tieWarn = "";
  if(ctx.live){
    const keptCount = ownerKeptCount(owner);
    const pending = unresolvedTies(owner);
    tieWarn = pending.length ? `<div class="tiewarn">⚠ ${pending.map(g =>
        g.players.map(p=>esc(p.name)).join(" & ") + " both cost " + g.cost).join("; ")}.
        Two keepers can't take the same round — assign each a round in the Keeping column.
        ${season} can't be finalized until you do.</div>` : "";
    meta = `${total} tracked · ${keptCount}/2 keeper slots used`;
  } else {
    const kept = players.filter(p => ctx.kept && ctx.kept.has(deriveKey(p.name))).length;
    meta = `${total} eligible pool · ${kept} kept into ${season}`;
  }

  return `<div class="owner-card ${isOpen?'open':''}">
    <div class="owner-head" onclick="toggleOwner('${owner}')">
      <h3><span class="chev">&#9656;</span> ${owner}</h3>
      <div class="meta">${meta}</div>
    </div>
    <div class="owner-body">
      ${tieWarn}
      <table>
        <thead><tr>
          <th style="width:24%">Player</th>
          <th style="width:10%">${season-1} Draft Rd</th>
          <th style="width:28%">Owned Seasons</th>
          <th style="width:16%">Cost ${season}</th>
          <th style="width:14%">${ctx.live ? "Keeping" : "Kept"} ${season}</th>
          <th style="width:4%"></th>
        </tr></thead>
        <tbody>${players.map(p => playerRow(p, ctx)).join("")}</tbody>
      </table>
    </div>
  </div>`;
}

function renderKeepersPanel(){
  if(!isWorkingSeason()) return renderKeepersToolbar() + renderHistoricalSeason(STATE.season);
  // Must be an arrow, not a bare reference: map passes (value, index, array),
  // which would land the index in ctx and the owners array in pool, and every
  // card would render read-only against a pool with no players in it.
  return renderKeepersToolbar() + OWNERS.map(o => renderOwnerCard(o)).join("") + renderFreeAgents();
}

/* A past season, seen from where it actually stood: the pool that was eligible
   going into it, each player's round in the draft before it, their owned-season
   history to that point, what they cost, and who was actually kept.

   This is the same derivation the working season uses, just aimed at an earlier
   year — deriveWorkingSet(seasons, Y) is "everyone who finished Y-1 on a roster,
   priced for Y". Rendering it through the same card is the point: a past season
   should not be a different-looking summary, it should be the same view. */
function renderHistoricalSeason(year){
  const seasons = STATE.seasons || {};
  if(!seasons[year - 1]){
    return `<div class="grid-owner"><div class="pnote">
      ${year} can't be shown from its own standpoint — that needs ${year-1}'s final
      rosters, and the archive starts at ${firstSeason()}. The Seasons tab has ${year}'s draft.
    </div></div>`;
  }

  const out = deriveWorkingSet(seasons, year);
  if(!out.players.length){
    return `<div class="grid-owner"><div class="pnote">Nothing to show for ${year}.</div></div>`;
  }

  // Who was actually kept that year, from that year's own draft.
  const kept = new Set(((seasons[year] || {}).draft || [])
    .filter(d => d.keeperCost != null).map(d => deriveKey(d.player)));
  const ctx = { season: year, live: false, kept: kept };

  const owners = [...new Set(out.players.map(p => p.owner))].sort();
  const cards = owners.map(o => renderOwnerCard(o, ctx, out.players)).join("");

  const eligible = out.players.filter(p => getStatus(p, year).eligible).length;
  const haveDraft = !!(seasons[year] && (seasons[year].draft || []).length);

  /* Transactions and a season-end date were only ever captured from 2025 on, so
     earlier years can't apply rule 8's four-week gate. Say so — otherwise these
     costs look like the full calculation when they are missing one rule. */
  const gaps = out.anomalies.filter(a => /season-end date/.test(a));
  const caveat = gaps.length ? `<br><br><b>Rule 8 isn't applied to ${year}.</b>
      ${year-1}'s transaction log and season-end date were never captured, so nobody here is
      ruled out for being added inside the last four weeks. Everything else — the chains,
      the 3-year cap, the 1st-round lock — is exact.` : "";

  return `<div class="banner">
      <b>${year}, as it stood going in.</b> ${out.players.length} players came off ${year-1}'s
      final rosters, ${eligible} of them keeper-eligible${
        haveDraft ? `, and ${kept.size} ${kept.size===1?"was":"were"} kept` : ""}.
      Same calculation as the working season, pointed at ${year} — read-only, because it already happened.${caveat}
    </div>${cards}`;
}

/* Exactly what publishing would produce, in a new tab, without publishing.
   Built from the same buildShareableHTML call, so the preview cannot drift
   from the real thing. */
window.previewLeaguePage = function(){
  // An overlay, not window.open: pop-ups are blocked unpredictably — file://
  // pages, sandboxed frames — and a blocked pop-up plus a suppressed alert is
  // a button that does nothing at all, which is how this was found.
  const html = buildShareableHTML();
  const url = URL.createObjectURL(new Blob([html], {type:"text/html"}));
  const old = document.getElementById("league-preview");
  if(old) old.remove();

  const wrap = document.createElement("div");
  wrap.id = "league-preview";
  wrap.style.cssText = "position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,0.75);" +
                       "display:flex;flex-direction:column;";
  wrap.innerHTML =
    `<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--field-dark);border-bottom:2px solid var(--gold);">
      <b style="color:var(--gold);letter-spacing:0.06em;">LEAGUE PAGE PREVIEW</b>
      <span style="color:var(--chalk-dim);font-size:12px;">exactly what publishing sends — nothing has been published</span>
      <span style="flex:1"></span>
      <a class="btn secondary small" style="text-decoration:none;" href="${url}" target="_blank" rel="noopener">Open in new tab</a>
      <button class="btn small" id="league-preview-close">&times; Close preview</button>
    </div>
    <iframe style="flex:1;border:0;background:#fff;" title="League page preview"></iframe>`;
  document.body.appendChild(wrap);
  wrap.querySelector("iframe").src = url;

  const close = () => {
    wrap.remove();
    URL.revokeObjectURL(url);
    document.removeEventListener("keydown", onKey);
  };
  const onKey = (e) => { if(e.key === "Escape") close(); };
  wrap.querySelector("#league-preview-close").onclick = close;
  document.addEventListener("keydown", onKey);
}

/* Is the league page actually live, and is it the current one? Answered through
   api.github.com rather than by fetching the site: GitHub Pages sends no CORS
   headers, so a direct fetch from this app is blocked and would look like an
   outage. The API is CORS-enabled and we already hold a token. */
window.checkLiveStatus = async function(){
  const g = STATE.github || {};
  if(!g.token || !g.owner || !g.repo) return;
  liveBusy = true;
  if(activeTab === "settings") render();
  const out = { at: new Date().toISOString(), build: null, builtAt: null,
                fileSha: null, fileBytes: null, url: null, why: null };
  try{
    const H = { "Authorization": "Bearer " + g.token, "Accept": "application/vnd.github+json" };
    const base = `https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`;

    const b = await fetch(base + "/pages/builds/latest", { headers: H });
    if(b.ok){
      const j = await b.json();
      out.build = j.status || "unknown";      // built | building | errored
      out.builtAt = j.updated_at || j.created_at || null;
    } else if(b.status === 404){
      out.build = "no-pages";
    } else {
      out.build = "unreadable";               // token lacks the Pages permission
    }

    const p = await fetch(base + "/pages", { headers: H });
    if(p.ok){ const j = await p.json(); out.url = j.html_url || null; }
    if(!out.url) out.url = `https://${g.owner}.github.io/${g.repo}/`;

    const c = await fetch(base + "/contents/" + encodeURIComponent(g.path || "index.html"),
      { headers: H });
    if(c.ok){ const j = await c.json(); out.fileSha = j.sha; out.fileBytes = j.size; }
    else if(c.status === 404) out.why = "index.html is not in the repo yet";
  }catch(e){ out.why = e.message; }
  liveStatus = out;
  liveBusy = false;
  if(activeTab === "settings") render();
};

function renderLivePanel(){
  const g = STATE.github || {};
  if(!g.token || !g.owner || !g.repo) return "";
  const lp = g.lastPublish || null;
  const s = liveStatus;

  // Current build vs what was last published. Byte length, not a hash: it is
  // free, and any real edit moves it. Labelled as an estimate, not a promise.
  let drift = null;
  if(lp && lp.bytes){
    try{ drift = buildShareableHTML().length - lp.bytes; }catch(e){ drift = null; }
  }

  let dot = "var(--chalk-dim)", label = "Not checked yet", detail = "";
  if(s){
    if(s.build === "built"){
      dot = "var(--ok)"; label = "LIVE";
      detail = "GitHub Pages built and serving" + (s.builtAt ? " · " + agoText(s.builtAt) : "");
    } else if(s.build === "building"){
      dot = "var(--gold)"; label = "PUBLISHING";
      detail = "GitHub is building the page — usually under a minute";
    } else if(s.build === "errored"){
      dot = "var(--danger)"; label = "BUILD FAILED";
      detail = "Pages tried to build and failed — check the repo's Pages settings";
    } else if(s.build === "no-pages"){
      dot = "var(--danger)"; label = "PAGES OFF";
      detail = "Pages is not enabled: repo Settings → Pages → Source: main";
    } else {
      dot = "var(--gold)"; label = s.fileSha ? "FILE IS THERE" : "UNKNOWN";
      detail = "Couldn't read build status (token has no Pages permission). " +
               (s.fileSha ? "The page file is in the repo." : "");
    }
    if(s.why) detail += (detail ? " · " : "") + esc(s.why);
  }

  const publishedMatches = !!(s && lp && s.fileSha && lp.sha && s.fileSha === lp.sha);

  return `<div class="grid-owner">
    <h4>League page &mdash; live status</h4>
    <div class="livehead">
      <span class="livedot" style="background:${dot};"></span>
      <b style="color:${dot};letter-spacing:.06em;">${label}</b>
      <span class="pnote">${esc(detail)}</span>
      <span style="flex:1"></span>
      <button class="btn secondary small" onclick="checkLiveStatus()" ${liveBusy?"disabled":""}>
        ${liveBusy ? "Checking&hellip;" : "&#8635; Check now"}</button>
    </div>
    <table class="previewtable" style="margin-top:10px;">
      <tbody>
        <tr><td>Address</td><td class="mono">${s && s.url
          ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--gold);">${esc(s.url)}</a>`
          : `https://${esc(g.owner)}.github.io/${esc(g.repo)}/`}</td></tr>
        <tr><td>Last published from here</td><td class="mono">${lp
          ? esc(lp.at.slice(0,16).replace("T"," ")) + " · " + agoText(lp.at) +
            (lp.commit ? " · " + esc(lp.commit.slice(0,7)) : "")
          : "never — click Publish below"}</td></tr>
        <tr><td>Live copy</td><td class="mono ${publishedMatches?"live":""}">${
          !s ? "&mdash;"
          : !s.fileSha ? "no page file in the repo"
          : publishedMatches ? "matches what you last published"
          : "differs from your last publish (or was published elsewhere)"}</td></tr>
        <tr><td>Unpublished changes</td><td class="mono ${drift ? "zero" : (drift===0?"live":"")}">${
          drift == null ? "&mdash;"
          : drift === 0 ? "none — the live page is current"
          : (drift > 0 ? "+" : "") + drift.toLocaleString() + " bytes of changes since you published"}</td></tr>
      </tbody>
    </table>
    ${drift ? `<div class="import-help" style="color:var(--gold);margin-top:8px;">
      The page has changed since you last published. Hit publish again to push it.</div>` : ""}
  </div>`;
}

/* One place that answers "is my data safe, and where". Four independent copies,
   each either present or not. The distinction that keeps being asked about:
   "Back up my data" is a one-off snapshot you have to remember to take, the
   folder is the same file written automatically on every save. */
function dataCopies(){
  const h = saveHealth;
  const g = STATE.github || {};
  const lp = g.lastPublish || null;
  return [
    { key:"browser", name:"This browser",
      where: h.backend || "localStorage",
      ok: h.ok !== false,
      note: h.ok === false ? "NOT SAVING — " + (h.why || "")
          : (STATE.savedAt ? "saved " + agoText(STATE.savedAt) : "saved this session"),
      warn: "Origin-scoped. Open this file from a different address and it is a different, empty store.",
      auto: true },
    { key:"folder", name:"Folder on this computer",
      where: dirHandle ? fsState.name + "/" + FS_MAIN : (fsState.supported ? "not set up" : "browser can't"),
      ok: !!dirHandle && fsState.ok !== false,
      note: !fsState.supported ? "Chrome or Edge only"
          : !dirHandle ? "not connected"
          : fsState.ok === false ? "FAILED — " + (fsState.why || "")
          : fsState.at ? "written " + agoText(fsState.at) : "connected",
      warn: "A real file on disk. Survives cleared browser data.",
      auto: true },
    { key:"cloud", name:"GitHub (off this machine)",
      where: cloudConfigured() ? (g.owner || "") + "/" + (syncRepoName() || "") : "not connected",
      ok: cloudConfigured() && syncHealth.push !== false,
      note: !cloudConfigured() ? "no token entered"
          : syncHealth.push === false ? "LAST PUSH FAILED — " + (syncHealth.why || "")
          : syncHealth.pushedAt ? "pushed " + agoText(syncHealth.pushedAt)
          : (cloudPullDone ? "connected, nothing pushed yet this session" : "waiting on first pull"),
      warn: "The only copy that survives this computer dying.",
      auto: true },
    { key:"published", name:"Published league page",
      where: lp ? (lp.url || "") : "never published",
      ok: !!lp,
      note: lp ? "published " + agoText(lp.at) : "the league can't see anything yet",
      warn: "What the league reads. Not a backup — it holds no editable data.",
      auto: false }
  ];
}

function renderWherePanel(){
  const copies = dataCopies();
  const live = copies.filter(c => c.key !== "published" && c.ok).length;
  const rows = copies.map(c => `<tr>
    <td style="width:26px;"><span class="livedot" style="background:${
      c.ok ? "var(--ok)" : "var(--danger)"};"></span></td>
    <td><b>${esc(c.name)}</b><div class="pnote">${esc(c.warn)}</div></td>
    <td class="mono" style="width:34%">${esc(c.where)}</td>
    <td class="mono ${c.ok?"live":"zero"}" style="width:22%">${esc(c.note)}</td>
  </tr>`).join("");

  /* A new device -- a phone, another browser -- is indistinguishable from a
     broken one unless you say so. Credentials never sync by design, so the app
     always starts here looking empty, and that reads as "it didn't sync". */
  const looksNew = !cloudConfigured() && !(STATE.savedAt) &&
                   (STATE.players || []).length === (SEED_PLAYERS || []).length;
  const newDevice = looksNew ? `<div class="tiewarn" style="margin-bottom:10px;">
    <b>New device?</b> Your league data is safe in GitHub &mdash; it just hasn't been
    pulled down here yet. Your token is the one thing that never syncs, on purpose, so
    enter it once in <b>GitHub Pages auto-publish</b> below and everything downloads.
    <br><br>
    Only browsing? The read-only league page needs no setup at all:
    ${(STATE.github||{}).appUrl
      ? `<a href="${esc((STATE.github.appUrl||"").replace(/app\.html$/,""))}" target="_blank"
           rel="noopener" style="color:var(--gold);">open the league page &rarr;</a>`
      : `it's the address you publish to.`}
  </div>` : "";

  const tone = live >= 2 ? "var(--ok)" : (live === 1 ? "var(--gold)" : "var(--danger)");
  const headline = live >= 2 ? `Your data is in ${live} places`
                 : live === 1 ? "Your data is in ONE place only"
                 : "Your data is not being saved anywhere";
  const advice = live >= 2 ? "Losing any one of them costs you nothing."
    : live === 1 ? "If that one goes, the data goes with it. Connect another below."
    : "Fix this before doing anything else.";

  /* The single most confusing thing about this app: storage is keyed to the
     address it was opened from, so the same file at a different address is a
     different, empty app. Say which address you are on, every time. */
  const here = location.origin + location.pathname;
  const home = (STATE.github || {}).appUrl || null;
  const onHome = home && here.replace(/\/+$/,"") === home.replace(/\/+$/,"");
  const addr = `<div class="import-help" style="margin-bottom:10px;${
      home && !onHome ? "color:var(--gold);" : ""}">
    <b>You are running this from:</b> <span class="mono">${esc(here)}</span><br>
    Your saved data belongs to that address. Open the same file from anywhere else and it
    starts empty &mdash; nothing is lost, it is just a different drawer.
    ${home ? (onHome
      ? ` This is your permanent address. Good.`
      : ` <b>Your permanent address is <span class="mono">${esc(home)}</span></b> — that is
          where your data is. Open that one and bookmark it.`)
     : ` Give it a permanent address below and this stops mattering.`}
  </div>`;

  return `<div class="grid-owner" style="border-color:${tone};">
    <h4>Where your data lives</h4>
    ${newDevice}
    ${addr}
    <div class="livehead" style="margin-bottom:10px;">
      <span class="livedot" style="background:${tone};"></span>
      <b style="color:${tone};letter-spacing:.05em;">${headline.toUpperCase()}</b>
      <span class="pnote">${advice}</span>
    </div>
    <table class="previewtable"><tbody>${rows}</tbody></table>
    <div class="import-help" style="margin-top:10px;">
      The first three are <b>automatic</b> &mdash; every save writes to all of them that are
      connected. <b>&#8681; Back up my data</b> is different: a one-off snapshot to your
      Downloads folder that you have to remember to take. Useful before something risky;
      not a substitute for the three above.
    </div>
  </div>`;
}

function keeperRulesSection(){

/* The current season, in the same table the commissioner works from — pills,
   prior draft round, cost, and a KEEPING mark once picks are finalized. This is
   the default view; the Simple toggle collapses it to just names and numbers. */
function valuesDetailedSection(season){
  const cards = OWNERS.map(o => {
    const mine = STATE.players.filter(p => p.owner === o);
    if(!mine.length) return "";
    const keeping = mine.filter(p => p.keepThisYear).length;
    const rows = mine.map(p => {
      const st = getStatus(p, season);
      const lastRd = p.lastDraftRound != null ? p.lastDraftRound
                   : (p.draftYear === season - 1 && p.draftedRound != null ? p.draftedRound : null);
      return `<tr class="${p.keepThisYear ? "keptrow" : (st.eligible ? "" : "dimrow")}">
        <td class="pcell">${esc(p.name)}${positionTag(p.name)}</td>
        <td class="rdcell">${lastRd != null ? lastRd : "—"}</td>
        <td>${historyPillStack(p, season)}</td>
        <td class="costcell">${st.eligible
            ? `<span class="val">${st.cost}</span>`
            : `<span class="val zero">0 &middot; Ineligible</span><div><span class="inelig">${esc(st.reason || "Ineligible")}</span></div>`}</td>
        <td class="keptcell">${p.keepThisYear ? `<span class="keptmark">KEEPING</span>` : ""}</td>
      </tr>`;
    }).join("");
    return `<details class="histowner">
      <summary><h2>${esc(o)}</h2>
        <span class="histmeta">${mine.length} players${keeping ? ` · keeping ${keeping}` : ""}</span></summary>
      <table class="histtable">
        <thead><tr>
          <th style="width:22%">Player</th>
          <th style="width:9%">${season-1} Draft Rd</th>
          <th style="width:33%">Owned Seasons</th>
          <th style="width:24%">Cost ${season}</th>
          <th>Keeping ${season}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </details>`;
  }).join("");
  return cards;
}

/* League History is the draft archive: every draft since the league's first
   recorded season, pick by pick, keepers in gold with their tie-breaker notes.
   One collapsed block per year. */
function draftHistorySection(){
  const seasons = STATE.seasons || {};
  const years = Object.keys(seasons).map(Number)
    .filter(y => (seasons[y].draft || []).length)
    .sort((a,b) => b - a);
  if(!years.length) return "";

  const blocks = years.map(y => {
    const s = seasons[y];
    const raw = s.draft || [];
    const perRound = {};
    const picks = raw.map((d, i) => {
      perRound[d.round] = (perRound[d.round] || 0) + 1;
      return Object.assign({}, d, { overall: i + 1, inRound: perRound[d.round] });
    });
    const ks = picks.filter(d => d.keeperCost != null);
    const offsetEra = ks.length > 1 &&
      ks.every(d => d.yahooSalary != null && d.round === d.yahooSalary + 1);
    const isBump = (d) => !offsetEra && d.keeperCost != null &&
      d.yahooSalary != null && d.yahooSalary !== d.round;

    const rows = picks.map(d => {
      const isK = d.keeperCost != null;
      return `<tr${isK ? ' class="keptrow"' : ''}>
        <td class="rdcell" style="color:var(--chalk-dim);">${d.overall}</td>
        <td class="rdcell">${d.round}.${String(d.inRound).padStart(2,"0")}</td>
        <td class="pcell">${esc(d.player)}${positionTag(d.player)}</td>
        <td>${esc(d.owner || "—")}</td>
        <td class="costcell">${isK ? `<span class="val">${d.keeperCost}</span>` : `<span class="notkept">—</span>`}${
          isBump(d) ? ` <span class="chip tie">rule 9 tie-breaker · ${d.yahooSalary}→${d.round}</span>` : ""}</td>
      </tr>`;
    }).join("");

    return `<details class="histyear">
      <summary><b>${y}</b> &middot; ${raw.length} picks &middot; ${ks.length} keeper${ks.length===1?"":"s"}</summary>
      <table class="histtable" style="margin-top:12px;">
        <thead><tr>
          <th style="width:7%">Pick</th><th style="width:8%">Rd·Pk</th>
          <th style="width:38%">Player</th><th style="width:20%">Owner</th>
          <th>Keeper cost</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </details>`;
  }).join("");

  return `<section class="rules" id="history">
    <h2>League History — the drafts</h2>
    <p>Every draft we've ever run, pick by pick, warts and all. Gold rows were keepers;
    a tie-breaker note means two keepers landed on the same round and one had to bump up.</p>
    ${blocks}
  </section>`;
}

function historyPillStack(p, season){
  const runs = ownedSeasons(p);
  const chips = runs.slice().sort((a,b)=>(a.year||0)-(b.year||0)).map(s=>{
    const what = s.kind === "drafted" ? "drafted Rd" + s.round
               : s.kind === "added" ? "added FA/waivers"
               : "kept Rd" + s.round;
    return `<div class="pillline"><span class="chip">${s.year != null ? s.year + " · " : ""}${what}</span></div>`;
  }).join("");
  const used = Math.min(3, getCostForSeason(p, season).ownerCount + 1);
  const capped = used >= 3;
  return chips + `<div class="yearsline${capped ? " capped" : ""}">${used} of 3 years with ${esc(p.owner || "—")}${capped ? " — cap reached" : ""}</div>`;
}

      <span class="notkept">${esc(h.first.team)}</span></td>
    <td>${esc(h.second.owner)}</td>

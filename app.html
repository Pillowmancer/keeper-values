/* Historical keeper values, year by year — the same commissioner view the
   current-season tab uses, driven by the same toggle. */
function histValuesSection(){
  const seasons = STATE.seasons || {};
  const years = Object.keys(seasons).map(Number)
    .filter(y => y > firstSeason() && y < workingSeason() && seasons[y-1] && seasons[y-1].rosters)
    .sort((a,b) => b - a);
  if(!years.length) return "";

  const blocks = years.map(y => {
    const out = deriveWorkingSet(seasons, y);
    if(!out.players.length) return "";
    const kept = new Set(((seasons[y] || {}).draft || [])
      .filter(d => d.keeperCost != null).map(d => deriveKey(d.player)));

    const owners = [...new Set(out.players.map(p => p.owner))].sort();
    const detailed = owners.map(o => {
      const mine = out.players.filter(p => p.owner === o);
      const keptCount = mine.filter(p => kept.has(deriveKey(p.name))).length;
      const rows = mine.map(p => {
        const st = getStatus(p, y);
        const wasKept = kept.has(deriveKey(p.name));
        const lastRd = p.lastDraftRound != null ? p.lastDraftRound
                     : (p.draftYear === y - 1 && p.draftedRound != null ? p.draftedRound : null);
        return `<tr class="${wasKept ? "keptrow" : (st.eligible ? "" : "dimrow")}">
          <td class="pcell">${esc(p.name)}${positionTag(p.name)}</td>
          <td class="rdcell">${lastRd != null ? lastRd : "—"}</td>
          <td>${historyPillStack(p, y)}</td>
          <td class="costcell">${st.eligible
              ? `<span class="val">${st.cost}</span>`
              : `<span class="val zero">0 &middot; Ineligible</span><div><span class="inelig">${esc(st.reason || "Ineligible")}</span></div>`}</td>
          <td class="keptcell">${wasKept ? `<span class="keptmark">KEPT</span>` : ""}</td>
        </tr>`;
      }).join("");
      return `<details class="histowner">
        <summary><h2>${esc(o)}</h2>
          <span class="histmeta">${mine.length} players${keptCount ? ` · ${keptCount} kept` : ""}</span></summary>
        <table class="histtable">
          <thead><tr>
            <th style="width:22%">Player</th><th style="width:9%">${y-1} Draft Rd</th>
            <th style="width:33%">Owned Seasons</th><th style="width:24%">Cost ${y}</th>
            <th>Kept ${y}</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </details>`;
    }).join("");

    const simple = owners.map(o => {
      const rows = out.players.filter(p => p.owner === o).map(p => {
        const st = getStatus(p, y);
        const wasKept = kept.has(deriveKey(p.name));
        return `<tr class="${wasKept ? "keptrow" : (st.eligible ? "" : "ineligible-row")}">
          <td>${esc(p.name)}</td>
          <td class="valcell">${st.eligible ? `<span class="val">${st.cost}</span>`
            : `<span class="val zero">0</span> <span class="tag">Ineligible</span>`}${
            wasKept ? ' <span class="keptmark">KEPT</span>' : ""}</td></tr>`;
      }).join("");
      return `<section class="team"><h2>${esc(o)}</h2><table><tbody>${rows}</tbody></table></section>`;
    }).join("");

    return `<details class="histyear">
      <summary><b>${y}</b> &middot; keeper values &middot; ${kept.size} kept</summary>
      <div class="values-detailed" style="margin-top:12px;">${detailed}</div>
      <div class="values-simple" style="margin-top:12px;"><div class="grid">${simple}</div></div>
    </details>`;
  }).join("");

  return `<section class="rules" id="hist-values">
    <h2>Keeper Values, year by year</h2>
    <p>Every season's keeper board, exactly as it looked at the time — a scroll back
    through who paid what, and who got away with murder.</p>
    <div class="viewtoggle">
      <a id="tog-h-detailed" href="#history">Detailed</a>
      <a id="tog-h-simple" href="#history-simple">Simple</a>
    </div>
    ${blocks}
  </section>`;
}

  return `<!DOCTYPE html>

  (function(){

    var tabs=["welcome","values","rules","history","hall"];
    var QUIPS=SACKO_QUIPS_PUB.slice();
    for(var i=QUIPS.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
      var tmp=QUIPS[i];QUIPS[i]=QUIPS[j];QUIPS[j]=tmp;}
    var qi=0;
    document.querySelectorAll(".quip").forEach(function(q){
      q.textContent=QUIPS[qi++ % QUIPS.length];
    });
    var forced=null;

      var h=forced||(location.hash||"").replace("#","");

      var v=document.getElementById("tab-values");
      if(v)v.classList.toggle("simple",view==="simple");
      var det=document.getElementById("tog-detailed"),sim=document.getElementById("tog-simple");
      if(det)det.classList.toggle("active",view==="detailed");
      if(sim)sim.classList.toggle("active",view==="simple");

      if(ht)ht.classList.toggle("simple",hview==="simple");
      var hd=document.getElementById("tog-h-detailed"),hsm=document.getElementById("tog-h-simple");
      if(hd)hd.classList.toggle("active",hview==="detailed");
      if(hsm)hsm.classList.toggle("active",hview==="simple");
      window.scrollTo(0,0);
    }
    // Clicking a tab must not depend on the fragment actually changing. Inside
    // some embedded frames the hash never lands and hashchange never fires, so
    // every tab but Welcome became unreachable and the page looked half-built.
    // Drive the switch directly; treat the URL as a nicety.
    [].forEach.call(document.querySelectorAll(".pagenav a, .viewtoggle a"),function(a){
      a.addEventListener("click",function(ev){
        ev.preventDefault();
        forced=(a.getAttribute("href")||"").replace("#","");
        try{ if(window.history&&history.replaceState) history.replaceState(null,"","#"+forced); }
        catch(err){}
        show();
      });
    });
    window.addEventListener("hashchange",function(){forced=null;show();});
    show();

    // Countdowns. Rendered blank and filled in here, so a page sitting open
    // overnight still shows the truth in the morning.
    var blocks=[].slice.call(document.querySelectorAll(".cdblock"));
    function tick(){
      var now=Date.now();
      blocks.forEach(function(b){
        var t=Date.parse(b.getAttribute("data-deadline"));
        if(isNaN(t))return;
        var left=t-now;
        var nums=b.querySelectorAll(".cdnum");
        if(left<=0){
          b.classList.add("past");
          b.classList.remove("soon");
          var c=b.querySelector(".cdclock");
          if(c&&!c.getAttribute("data-done")){
            c.setAttribute("data-done","1");
            c.innerHTML='<span class="cdnum">Passed</span>';
          }
          return;
        }
        b.classList.toggle("soon",left<3*86400000);
        var s=Math.floor(left/1000);
        var v={d:Math.floor(s/86400),h:Math.floor(s%86400/3600),
               m:Math.floor(s%3600/60),s:s%60};
        [].forEach.call(nums,function(n){
          var u=n.getAttribute("data-unit");
          if(u&&v[u]!=null)n.textContent=(u==="d")?v[u]:String(v[u]).padStart(2,"0");
        });
      });
    }
    if(blocks.length){tick();setInterval(tick,1000);}
  })();
  <\/script>
</div></body></html>`;
}

/* Reaches the API once for each repo and reports what it finds, because the
   failure modes here are all silent: a token scoped to one repo but not the
   other, Pages never switched on, a typo in a repo name. Better to hear it
   here than to discover the draft order never left the browser. */
window.testGithubConnection = async function(){
  const g = STATE.github || {};
  if(!g.token || !g.owner || !g.repo){
    uiAlert("Add your token, username and public repo name first, then Save.");
    return;
  }
  const btn = document.getElementById("ghTestBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Checking..."; }
  const lines = [];
  const check = async (repo, label) => {
    try{
      const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(repo)}`,
        { headers: { "Authorization": "Bearer " + g.token, "Accept": "application/vnd.github+json" } });
      if(r.status === 404){
        lines.push(`${label} (${repo}): NOT FOUND — check the name, or the token isn't scoped to it.`);
        return null;
      }
      if(r.status === 401){ lines.push(`${label}: token rejected (401). It may be expired.`); return null; }
      if(!r.ok){ lines.push(`${label} (${repo}): HTTP ${r.status}.`); return null; }
      const j = await r.json();
      const perms = j.permissions || {};
      lines.push(`${label} (${repo}): found — ${j.private ? "private" : "PUBLIC"}` +
                 `, write access ${perms.push ? "yes" : "NO"}.`);
      return j;
    }catch(e){ lines.push(`${label} (${repo}): ${e.message}`); return null; }
  };

  const pages = await check(g.repo, "League page repo");
  const sync = syncRepoName() === g.repo ? null : await check(syncRepoName(), "Private data repo");
  if(syncRepoName() === g.repo){
    lines.push(`Data repo: same as the league page repo` +
      (pages && !pages.private ? " — which is PUBLIC, so your saved data is public too." : "."));
  } else if(sync && !sync.private){
    lines.push("Warning: your data repo is public. Make it private in its GitHub settings.");
  }

  try{
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/pages`,
      { headers: { "Authorization": "Bearer " + g.token, "Accept": "application/vnd.github+json" } });
    if(r.ok){ const j = await r.json(); lines.push("GitHub Pages: on — " + (j.html_url || "(no URL yet)")); }
    else if(r.status === 404) lines.push("GitHub Pages: not enabled yet — repo Settings -> Pages -> Source: main.");
    else lines.push("GitHub Pages: HTTP " + r.status + " (Pages status needs the Pages permission; publishing may still work).");
  }catch(e){ lines.push("GitHub Pages: " + e.message); }

  if(btn){ btn.disabled = false; btn.textContent = "Test connection"; }
  uiAlert(lines.join("\n\n"), "GitHub connection");
}

/* Sections of the league page vanish silently when the data behind them is
   empty, which is indistinguishable from a feature never having been built.
   Publishing from a browser that had lost its data produced a page missing the
   draft order and both countdowns, and looked for all the world like a bug.
   Say what will and will not appear, before it goes out. */
function publishPreflight(){
  const season = STATE.season;
  const ev = eventsFor(season) || {};
  const ord = draftOrderFor(season);
  const rostered = (STATE.players || []).filter(p => p.owner).length;
  return [
    { name: "Keeper values", ok: rostered > 0,
      detail: rostered ? rostered + " players" : "no rosters — import a season first" },
    { name: "Draft order", ok: !!(ord && (ord.order || []).length),
      detail: ord && (ord.order||[]).length
        ? (ord.locked ? "locked" : "provisional") : "not rolled — Draft Order tab" },
    { name: "Countdown to keeper deadline", ok: !!eventDate(ev.keeperDeadline),
      detail: eventDate(ev.keeperDeadline) ? formatEventWhen(ev.keeperDeadline)
                                           : "no date set — Draft Order tab, key dates" },
    { name: "Countdown to draft night", ok: !!eventDate(ev.draftAt),
      detail: eventDate(ev.draftAt) ? formatEventWhen(ev.draftAt)
                                    : "no date set — Draft Order tab, key dates" },
    { name: "Add-to-calendar links", ok: !!(eventDate(ev.draftAt) || eventDate(ev.keeperDeadline)),
      detail: "come with the dates above" },
    { name: "Where the draft is", ok: !!(ev.venue || ev.address),
      detail: ev.venue || ev.address || "no venue set" },
    { name: "Pot & weekly prizes", ok: !!payoutsFor(season),
      detail: payoutsFor(season) ? "set" : "nothing recorded for " + season },
    { name: "League history", ok: Object.keys(STATE.seasons || {}).length > 1,
      detail: Object.keys(STATE.seasons || {}).length + " seasons" },
    { name: "Hall of Fame", ok: honoursData().length > 0,
      detail: honoursData().length + " seasons of standings" }
  ];
}

window.publishToGithub = async function(silent){
  const { token, owner, repo, path } = STATE.github || {};
  if(!token || !owner || !repo){
    if(!silent) uiAlert("Add your GitHub token, username, and repo name first (below).");
    return;
  }
  const pre = publishPreflight();
  const missing = pre.filter(x => !x.ok);
  const NL = String.fromCharCode(10);
  const lines = pre.map(x => (x.ok ? "✓ " : "✗ ") + x.name + " — " + x.detail).join(NL);
  const go = silent ? true : await uiConfirm(
    "This is what the league will see:" + NL + NL + lines +
    (missing.length
      ? NL + NL + "The " + missing.length + " marked ✗ will not appear on the page at all. " +
        "They are hidden when empty, not broken — fill them in and publish again."
      : NL + NL + "Everything is there."),
    missing.length ? missing.length + " section(s) will be missing" : "Ready to publish");
  if(!go) return;
  const btn = document.getElementById("githubPublishBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Publishing..."; }
  try{
    const html = buildShareableHTML();
    const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodeURIComponent(path)}`;
    const headers = {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
    };

    // Look up the current file's sha (needed to update an existing file — omit for a brand new file)
    let sha = null;
    const getResp = await fetch(apiUrl, { headers });
    if(getResp.status === 200){
      const info = await getResp.json();
      sha = info.sha;
    } else if(getResp.status !== 404){
      const text = await getResp.text().catch(()=> "");
      throw new Error("Couldn't check the existing file (" + getResp.status + "): " + text.slice(0,200));
    }

    // btoa can't handle non-Latin1 characters directly — encode as UTF-8 bytes first
    const utf8Bytes = new TextEncoder().encode(html);
    let binary = "";
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const base64Content = btoa(binary);

    const putBody = {
      message: "Update keeper values — " + new Date().toISOString().slice(0,10),
      content: base64Content,
    };
    if(sha) putBody.sha = sha;

    const putResp = await fetch(apiUrl, {
      method: "PUT",
      headers: { ...headers, "Content-Type": "application/json" },
      body: JSON.stringify(putBody),
    });
    if(!putResp.ok){
      const text = await putResp.text().catch(()=> "");
      throw new Error("GitHub responded with " + putResp.status + ": " + text.slice(0,200));
    }
    const pagesUrl = `https://${owner}.github.io/${repo}/`;
    const info = await putResp.json().catch(()=>null);
    // Remember exactly what went out, so the indicator can later say whether the
    // live copy is still this one and whether anything has changed since.
    STATE.github.lastPublish = {
      at: new Date().toISOString(),
      bytes: html.length,
      sha: info && info.content ? info.content.sha : null,
      commit: info && info.commit ? info.commit.sha : null,
      url: pagesUrl
    };
    await saveState();
    liveStatus = null;
    checkLiveStatus();
    if(silent){ toastSaved("league page republished"); return; }
    uiAlert("Published.\n\nGitHub has the new page. Pages usually serves it within a\n" +
            "minute — the Live status panel above will turn green once it does.\n\n" + pagesUrl,
            "Published");
  }catch(err){
    // The automatic catch-up runs on load; it must not greet you with a modal.
    // It logs, and the Live status panel already shows the page is behind.
    if(silent){ console.error("Catch-up publish failed", err); logSync("publish", false, err.message); }
    else uiAlert("Couldn't publish — this can happen if the token, username, or repo name is wrong, or if GitHub Pages isn't enabled for this repo yet.\n\nError: " + err.message + "\n\nFallback: use \"Download read-only page\" below and upload it manually through GitHub's website — that always works regardless of this error.");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Publish live to GitHub Pages"; }
  }
}

/* Serving the app from a fixed https address fixes the thing no amount of
   backup logic can: localStorage is keyed to the address the page came from, so
   a throwaway localhost port or a file opened from a different folder is a
   different, empty app every time. One address, one store, forever — and it
   works from a phone.

   The page has no credentials in it; the token lives in the browser, not the
   file. Anyone loading this URL gets the app with no data in it. */
window.publishAppToPages = async function(){
  const { token, owner, repo } = STATE.github || {};
  if(!token || !owner || !repo){ uiAlert("Connect GitHub first."); return; }
  const appUrl = `https://${owner}.github.io/${repo}/app.html`;
  const go = await uiConfirm(
    "Put the commissioner app at a fixed address?\n\n" + appUrl + "\n\n" +
    "Why: this app remembers your data against the address it was opened from. A " +
    "temporary localhost port is a different address every time, which is why things " +
    "keep looking empty. A permanent URL fixes that, and works on your phone.\n\n" +
    "The page carries no token — whoever opens it sees an app with no data. Your " +
    "league's rosters and history are in it, the same ones already on the public page.",
    "Publish the app itself");
  if(!go) return;

  const btn = document.getElementById("appPublishBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Publishing..."; }
  try{
    // Its own source, not the live DOM — the DOM is full of rendered panels.
    const res = await fetch(location.href, { cache: "no-store" });
    if(!res.ok) throw new Error("couldn't read this page's own source (HTTP " + res.status + ")");
    const html = await res.text();
    if(!/<title>Keeper League Command Center<\/title>/i.test(html))
      throw new Error("that didn't look like the app's source");

    const { url, headers } = ghApi("app.html");
    let sha = null;
    const g = await fetch(url, { headers });
    if(g.status === 200) sha = (await g.json()).sha;
    else if(g.status !== 404) throw new Error("HTTP " + g.status + " checking the existing file");

    const bytes = new TextEncoder().encode(html);
    let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
    const body = { message: "Publish the commissioner app — " + new Date().toISOString().slice(0,10),
                   content: btoa(bin) };
    if(sha) body.sha = sha;
    const put = await fetch(url, { method:"PUT",
      headers: Object.assign({}, headers, {"Content-Type":"application/json"}),
      body: JSON.stringify(body) });
    if(!put.ok) throw new Error("HTTP " + put.status + " publishing");

    STATE.github.appUrl = appUrl;
    await saveState();
    render();
    uiAlert("The app is now at:\n\n" + appUrl + "\n\n" +
            "Open it there from now on and bookmark it. Give it a minute for Pages to " +
            "build.\n\nFirst visit will be empty — that address has its own store. Enter " +
            "your GitHub token in Settings and it pulls everything down, then point it at " +
            "your data folder again.", "App published");
  }catch(e){
    uiAlert("Couldn't publish the app.\n\n" + e.message +
      (/own source/.test(e.message)
        ? "\n\nThis needs the app to be served over http, not opened as a file:// path."
        : ""));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "\u{1F517} Give the app a permanent address"; }
  }
};

/* Updating the published app used to require opening it from a server that was
   already serving the newer code, which reintroduced the throwaway-server
   dependency the permanent address exists to remove. The permanent address can
   only ever fetch the old copy of its own source. Pointing at the .html in the
   project folder works from anywhere, including from the published app itself. */
window.publishAppFromFile = async function(ev){
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if(!f) return;
  const g = STATE.github || {};
  if(!g.token || !g.owner || !g.repo){ uiAlert("Connect GitHub first."); return; }
  const appUrl = "https://" + g.owner + ".github.io/" + g.repo + "/app.html";
  const NL = String.fromCharCode(10);
  const btn = document.getElementById("appFileBtn");
  try{
    const html = await f.text();
    if(!/<title>Keeper League Command Center<\/title>/i.test(html)){
      uiAlert("That file is not the commissioner app." + NL + NL +
              "Pick Keeper_League_Command_Center.html from your project folder.");
      return;
    }
    // A published page is a public page. Never let one out carrying a secret.
    if(/ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}/.test(html)){
      uiAlert("That file appears to contain a GitHub token, so nothing was published." + NL + NL +
              "A live credential must never reach a public address.", "Refused");
      return;
    }
    if(btn) btn.textContent = "Publishing...";

    const api = ghApi("app.html");
    let sha = null;
    const head = await fetch(api.url, { headers: api.headers, cache: "no-store" });
    if(head.status === 200) sha = (await head.json()).sha;
    else if(head.status !== 404) throw new Error("HTTP " + head.status + " checking the existing file");

    const bytes = new TextEncoder().encode(html);
    let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
    const body = { message: "Update the commissioner app - " + new Date().toISOString().slice(0,10),
                   content: btoa(bin) };
    if(sha) body.sha = sha;
    const put = await fetch(api.url, { method: "PUT",
      headers: Object.assign({}, api.headers, { "Content-Type": "application/json" }),
      body: JSON.stringify(body) });
    if(!put.ok){
      const txt = await put.text().catch(function(){ return ""; });
      throw new Error("HTTP " + put.status + " " + txt.slice(0,160));
    }

    STATE.github.appUrl = appUrl;
    await saveState();
    /* The league page is rendered by whatever code is *running*, so publishing
       it now would ship the old rendering alongside the new app. Flag it, and
       let the next load -- which is the new code -- do it. */
    try{ localStorage.setItem(PENDING_PUBLISH_KEY, "1"); }catch(e){}
    render();
    uiAlert("Published " + f.name + " to:" + NL + NL + appUrl + NL + NL +
            "Reload that page in a minute. The league page then republishes itself " +
            "automatically, so the app and the page can never drift apart." + NL + NL +
            "Your data is untouched - this replaces the code only.", "App updated");
  }catch(e){
    uiAlert("Couldn't publish that file." + NL + NL + (e && e.message ? e.message : ""));
  }finally{
    if(btn) btn.textContent = "Update from a file";
  }
};

/* ---------- Seasons archive ---------- */

function seasonYears(){
  const fromArchive = Object.keys((STATE.seasons)||{}).map(Number);
  const fromMembers = Object.keys((STATE.leagueMembers)||{}).map(Number);
  return [...new Set([...fromArchive, ...fromMembers])].sort((a,b)=>b-a);
}

// Membership edits apply from a season forward — a replacement is a change to
// the league, not to one year, and the later years should follow it.
function applyFromSeason(season, fn){
  Object.keys(STATE.leagueMembers).map(Number).filter(y => y >= season)
    .forEach(y => { STATE.leagueMembers[y] = fn(STATE.leagueMembers[y].slice()); });
}

window.addSeasonOwner = function(season){
  const raw = prompt("Add an owner, starting in " + season + ".\n\nThey'll carry into every later "
    + "season too, with no roster and no keeper history.", "");
  if(raw === null) return;
  const name = raw.trim();
  if(!name) return;
  if(ownersFor(season).some(o => o.toLowerCase() === name.toLowerCase())){
    uiAlert(name + " is already in the league in " + season + "."); return;
  }
  applyFromSeason(season, list => list.concat([name]).sort());
  saveState(); render();
}

window.replaceSeasonOwner = function(season, outgoing){
  const raw = prompt("Who replaces " + outgoing + ", starting in " + season + "?\n\n"
    + outgoing + " stays on every season before this one, so their history is kept intact.", "");
  if(raw === null) return;
  const name = raw.trim();
  if(!name) return;
  applyFromSeason(season, list => list.filter(o => o !== outgoing).concat([name]).sort());
  saveState(); render();
}

window.removeSeasonOwner = async function(season, owner){
  const held = STATE.players.filter(p => p.owner === owner).length;
  if(!await uiConfirm("Remove " + owner + " from " + season + " onward?\n\n"
    + (held ? held + " player(s) are currently under them — those stay put and would need reassigning.\n\n" : "")
    + "Earlier seasons keep " + owner + ", so their history isn't touched.")) return;
  applyFromSeason(season, list => list.filter(o => o !== owner));
  saveState(); render();
};

function renderSeasonsPanel(){
  const years = seasonYears();
  if(!years.length) return `<div class="grid-owner"><div class="pnote">No seasons recorded yet.</div></div>`;

  return years.map(y => {
    const s = (STATE.seasons||{})[y];
    const members = ownersFor(y);
    const keepers = s ? (s.draft||[]).filter(d => d.keeperCost != null) : [];
    const isWorking = y === STATE.season;

    const memberRows = members.map(o=>`
      <span class="chip" style="margin:2px 4px 2px 0;">
        ${esc(o)}
        <span class="rowbtn" style="padding:0 2px 0 6px" title="Someone replaces ${esc(o)} from ${y} on"
              onclick="replaceSeasonOwner(${y}, ${esc(JSON.stringify(o))})">&#8646;</span>
        <span class="rowbtn" style="padding:0 0 0 2px" title="Remove ${esc(o)} from ${y} on"
              onclick="removeSeasonOwner(${y}, ${esc(JSON.stringify(o))})">&times;</span>
      </span>`).join("");

    // The whole draft, in pick order. Keepers occupy real rounds alongside
    // everyone else, and rule 9 can push one down a round when two collide —
    // showing only the keepers hid both facts.
    /* Overall pick number isn't stored — the draft arrives in draft order, so
       position in the array IS the pick. Tag it before any sorting, or the
       numbers become whatever order the table happened to be drawn in. */
    const raw = s ? (s.draft||[]) : [];
    const perRound = {};
    const picks = raw.map((d, i) => {
      perRound[d.round] = (perRound[d.round] || 0) + 1;
      return Object.assign({}, d, { overall: i + 1, inRound: perRound[d.round] });
    }).sort((a,b)=> a.overall - b.overall);
    const ks = picks.filter(d => d.keeperCost != null);

    /* Yahoo's salary tooltip is the keeper's cost; the round is where he
       actually landed. Normally they agree, and a difference means rule 9 moved
       him — his round was already taken by another keeper at the same cost.

       Except in 2016-17, where every single keeper reads exactly one below his
       round. That is a recording convention of that era, not fourteen
       tie-breaks in one draft, so it is detected and ignored rather than
       reported as a league-wide collision. */
    const offsetEra = ks.length > 1 &&
      ks.every(d => d.yahooSalary != null && d.round === d.yahooSalary + 1);
    const isBump = (d) => !offsetEra && d.keeperCost != null &&
      d.yahooSalary != null && d.yahooSalary !== d.round;
    const bumped = picks.filter(isBump);
    const open = openSeasons.has(y);

    const draftRows = picks.length ? `
      <div class="toolbar" style="margin:10px 0 0;">
        <button class="btn secondary small" onclick="toggleSeasonDraft(${y})">
          ${open ? "&#9662; Hide" : "&#9656; Show"} all ${picks.length} picks</button>
        ${bumped.length ? `<span class="badge" style="background:rgba(232,171,31,0.15);color:var(--gold);">
          ${bumped.length} tie-break bump${bumped.length===1?"":"s"}</span>` : ""}
      </div>
      ${open ? `<table class="previewtable" style="margin-top:10px;">
        <thead><tr>
          <th style="width:7%">Pick</th><th style="width:8%">Rd·Pk</th>
          <th style="width:40%">Player</th><th style="width:18%">Owner</th>
          <th>Keeper cost</th></tr></thead>
        <tbody>${picks.map(d=>{
          const isK = d.keeperCost != null;
          const bump = isBump(d);
          // The gold row already says "keeper", so there is no How column —
          // a cost and a tint carry it. The tie-break rides with the cost,
          // as a pill, because that is the number it explains.
          return `<tr${isK?' class="iskeeper"':''}>
            <td class="mono" style="color:var(--chalk-dim);">${d.overall}</td>
            <td class="mono">${d.round}.${String(d.inRound).padStart(2,"0")}</td>
            <td class="pname">${esc(d.player)}${positionTag(d.player)}</td>
            <td>${esc(d.owner||"—")}</td>
            <td class="mono ${isK?"live":""}">${isK ? d.keeperCost : "—"}${
              bump ? ` <span class="chip tie" title="Cost ${d.yahooSalary}, but round ${d.yahooSalary} was already taken by another keeper, so the rule 9 tie-breaker moved him up a round.">rule 9 tie-breaker · ${d.yahooSalary}&rarr;${d.round}</span>` : ""}</td>
          </tr>`;
        }).join("")}
        </tbody></table>` : ""}` : `<div class="pnote" style="margin-top:8px;">No draft recorded for ${y}.</div>`;

    const keeperRows = draftRows;

    return `<div class="grid-owner"${isWorking?' style="border-color:var(--gold-dim);"':''}>
      <h4>${y}${isWorking?" &mdash; working season":""}
        ${s ? `<span class="badge" style="background:rgba(95,185,138,0.18);color:var(--ok);">draft imported</span>`
            : `<span class="badge ineligible">no draft yet</span>`}</h4>
      <div class="import-help" style="margin-bottom:6px;">
        ${members.length} owners${s ? ` &middot; ${(s.draft||[]).length} picks over ${s.rounds||"?"} rounds
        &middot; ${keepers.length} keepers${s.leagueId?` &middot; Yahoo league ${esc(s.leagueId)}`:""}` : ""}
      </div>
      <div style="margin-bottom:8px;">${memberRows}
        <span class="chip" style="cursor:pointer;border-style:dashed;opacity:.75;"
              onclick="addSeasonOwner(${y})">+ add owner</span></div>
      ${keeperRows}
    </div>`;
  }).join("");
}

/* ---------- Guide ---------- */

function workflowSVG(season){
  const prev = season - 1;
  // phase, label, detail, kind  — kind drives the colour key below
  // Deliberately free of specific years — this page should still read correctly
  // in ten seasons' time.
  const steps = [
    ["1", "The season ends", "Yahoo has the final rosters", "yahoo"],
    ["2", "Click \u{1F4E5} Capture WHS season", "On any Yahoo page of that season → downloads one file", "mark"],
    ["3", "Import → choose that file", "Draft, rosters, transactions, managers and season-end all read from it", "app"],
    ["4", "Owners matched automatically", "From Yahoo's own Managers page in the file — you just confirm", "app"],
    ["5", "Every keeper value recomputed", "The moment you import. Nothing to run.", "app"],
    ["6", "Keepers → keeper costs for Yahoo", "Downloads the costs file", "app"],
    ["7", "Click ✏️ Fill keeper salaries", "On Yahoo's Set Keeper Salaries page → pick that file", "mark"],
    ["8", "It fills and saves", "Done. The new costs are live in Yahoo.", "yahoo"]
  ];
  const fill = { yahoo:"#3d6ea8", mark:"var(--gold)", hand:"var(--danger)", app:"var(--ok)" };
  const BH = 62, GAP = 16, TOP = 8;
  const h = TOP + steps.length * (BH + GAP);

  const rows = steps.map((s, i) => {
    const y = TOP + i * (BH + GAP);
    const arrow = i < steps.length - 1
      ? `<path d="M28 ${y+BH} L28 ${y+BH+GAP}" stroke="var(--line)" stroke-width="2"/>` : "";
    return `${arrow}
      <circle cx="28" cy="${y+BH/2}" r="15" fill="${fill[s[3]]}" opacity="0.9"/>
      <text x="28" y="${y+BH/2+5}" text-anchor="middle" font-size="14" font-weight="bold"
            fill="#0b1a13" font-family="Helvetica Neue,Arial,sans-serif">${s[0]}</text>
      <rect x="54" y="${y}" width="566" height="${BH}" rx="6"
            fill="var(--card)" stroke="${fill[s[3]]}" stroke-opacity="0.55"/>
      <text x="70" y="${y+25}" font-size="14" font-weight="bold" fill="var(--chalk)"
            font-family="Helvetica Neue,Arial,sans-serif">${esc(s[1])}</text>
      <text x="70" y="${y+45}" font-size="12" fill="var(--chalk-dim)"
            font-family="Helvetica Neue,Arial,sans-serif">${esc(s[2])}</text>`;
  }).join("");

  return `<svg viewBox="0 0 630 ${h}" width="100%" style="max-width:630px;display:block;margin:6px 0 4px;"
               role="img" aria-label="Keeper season workflow, eight steps">${rows}</svg>`;
}

function renderGuidePanel(){
  const season = STATE.season;
  const prev = season - 1;
  const ready = BOOKMARKLETS.capture && BOOKMARKLETS.fill;

  const dragBtn = (href, label) => href
    ? `<a class="btn" href="${href}" style="cursor:grab;text-decoration:none;display:inline-block;">${label}</a>`
    : `<span class="btn secondary" style="opacity:.5;cursor:not-allowed;">${label} — not built yet</span>`;

  return `<div class="grid-owner">
    <h4>The season, end to end</h4>
    <div class="import-help">
      You do this once a year, right after the season wraps. Two of the eight steps are the
      bookmarklets — <b>Capture</b> at the very start, to pull the finished season's results
      out of Yahoo, and <b>Fill</b> at the very end, to put the new costs back in. Everything
      in between is just turning the first into the second, and none of it needs a terminal.
    </div>
    ${workflowSVG(season)}
    <div class="import-help" style="margin-top:10px;">
      <span style="color:var(--gold);">&#9679;</span> bookmarklet &nbsp;
      <span style="color:var(--ok);">&#9679;</span> this app &nbsp;
      <span style="color:#3d6ea8;">&#9679;</span> Yahoo
      &nbsp;&nbsp;— nothing here needs a command line.
    </div>
  </div>

  <div class="grid-owner">
    <h4>Install the bookmarklets</h4>
    <div class="import-help">
      <b>Drag each button onto your bookmarks bar.</b> Dragging is the only thing that actually
      works — pasting a <span class="mono">javascript:</span> address into the address bar gets
      blocked by the browser, and pasting it into the bookmark editor silently drops the
      <span class="mono">javascript:</span> part, leaving you with a bookmark that just sits there.
      Can't see the bar? Press <b>Ctrl+Shift+B</b> (Windows) or <b>Cmd+Shift+B</b> (Mac).
      <br><br>
      These are always the current versions. If a bookmark ever goes missing or stops working,
      come back here and drag it again — takes five seconds.
    </div>
    <div class="toolbar" style="margin-bottom:6px;">
      ${dragBtn(BOOKMARKLETS.capture, "&#128229; Capture WHS season")}
      ${dragBtn(BOOKMARKLETS.fill, "&#9999;&#65039; Fill keeper salaries")}
    </div>
    ${ready ? "" : `<div class="import-help" style="color:var(--danger);">
      Run <span class="mono">python scripts/build_bookmarklets.py</span> to put the current
      bookmarklets into this app.</div>`}

    <table style="margin-top:12px;">
      <thead><tr><th>Bookmarklet</th><th>Run it on</th><th>What it does</th><th>Changes Yahoo?</th></tr></thead>
      <tbody>
        <tr>
          <td><b>&#128229; Capture WHS season</b></td>
          <td>Any page of the season you're capturing</td>
          <td>Reads the draft, final rosters, every transaction page, the managers and
              season points. Takes about a minute, then downloads one file.</td>
          <td class="mono live">No — reads only</td>
        </tr>
        <tr>
          <td><b>&#9999;&#65039; Fill keeper salaries</b></td>
          <td>Commissioner &rarr; Set Keeper Salaries</td>
          <td>Asks for the costs file, fills every box, checks each one took, then saves.</td>
          <td class="mono">Yes — but only after every box verifies</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="grid-owner">
    <h4>Step by step</h4>
    <ol style="line-height:1.8; font-size:14px; color:var(--chalk-dim); padding-left:20px;">
      <li><b>Open any page of the finished season in Yahoo</b> — the draft results page is a
          good one — and click <b>&#128229; Capture WHS season</b>. Leave the tab alone for a
          minute. It downloads one <span class="mono">whs-&lt;year&gt;-capture.json</span> file.</li>
      <li><b>Come here, to Import</b>, and choose that file. The app reads the draft, the
          final rosters, every transaction, the managers and the season-end date.</li>
      <li><b>Check the owners and press import.</b> Yahoo's own Managers page is in the file,
          so the nickname &rarr; owner mapping comes straight from the source — it arrives
          filled in and you're only confirming it. A manager the app has never seen needs
          picking once, then it's remembered. No email is ever read from that page.</li>
      <li><b>Everything recomputes</b> the moment you import: every keeper value, from every
          stored season of drafts, rosters and transactions. Nothing to run, nothing to install.</li>
      <li><b>Keepers tab &rarr; keeper costs for Yahoo.</b> Saves the costs file.</li>
      <li><b>Open Yahoo's Set Keeper Salaries page</b> and click
          <b>&#9999;&#65039; Fill keeper salaries</b>. Choose the file you just saved — it
          fills every box, checks each one took, and saves.</li>
    </ol>
  </div>

  <div class="grid-owner">
    <h4>If something looks wrong</h4>
    <div class="import-help">
      <b>"Nothing was filled" and a list of players.</b> The costs file doesn't match who
      Yahoo currently lists — usually last season's file grabbed by mistake, or rosters that
      moved after the numbers were worked out. Nothing gets written and nothing gets saved.
      Redo steps 5&ndash;6 and try again. This is the safety check doing its job; don't go
      looking for a way around it.
      <br><br>
      <b>"Couldn't match these Yahoo team names to an owner."</b> Same idea, on import. A
      nickname on the draft page didn't line up with one on the Managers page. Nothing gets
      imported — fix the owner dropdowns and try again.
      <br><br>
      <b>A bookmark does nothing at all.</b> It was almost certainly created by pasting
      instead of dragging. Drag it again from this page.
      <br><br>
      <b>The capture finishes suspiciously fast, or the numbers look short.</b> Flag it rather
      than trusting it. A capture that ends early still produces a valid-looking file — that
      exact failure has happened once before, quietly returning 20 of 194 transactions with
      no error at all.
      <br><br>
      <b>Blank boxes in Yahoo are not "can't be kept".</b> A blank falls through to Default

      not a blank. For ${season} that's the difference for 32 players.
    </div>
  </div>`;
}

function renderHallPanel(){
  const hs = honoursData();
  if(!hs.length) return `<div class="grid-owner"><div class="pnote">No standings recorded yet.</div></div>`;
  const s = statsData();
  // Deal from a shuffled deck rather than rolling per row, so no quip repeats
  // on screen. With hundreds in the deck the wall reads fresh every visit.
  const deck = shuffle(SACKO_QUIPS); let qi = 0;
  const quip = () => deck[qi++ % deck.length];

  const champRows = hs.map(h => `<tr>
    <td class="mono">${h.year}</td>
    <td class="pname" style="color:var(--gold);">&#127942; ${esc(h.first.owner)}
      <span class="pnote">${esc(h.first.team)}</span></td>
    <td>${esc(h.second.owner)}</td><td>${esc(h.third.owner)}</td></tr>`).join("");

  const sackoRows = hs.map(h => `<tr>
    <td class="mono">${h.year}</td>
    <td class="pname">${esc(h.sacko.owner)} <span class="pnote">${esc(h.sacko.team)}</span></td>
    <td class="pnote" style="font-style:italic;">${esc(quip())}</td></tr>`).join("");

  const statCard = (title, items, unit) => `<div class="grid-owner" style="flex:1;min-width:220px;">
    <h4>${title}</h4>
    <table class="previewtable"><tbody>${items.slice(0,5).map((r,i)=>
      `<tr${i===0?' class="iskeeper"':''}><td>${esc(r.owner)}</td>
        <td class="mono" style="text-align:right">${unit==="$" ? money(r.n) : r.n}</td></tr>`).join("")
      || '<tr><td class="pnote">Nothing yet.</td></tr>'}</tbody></table></div>`;

  return `<div class="grid-owner">
      <h4>League Champions</h4>
      <table class="previewtable">
        <thead><tr><th>Year</th><th>Champion</th><th>2nd</th><th>3rd</th></tr></thead>
        <tbody>${champRows}</tbody></table>
    </div>
    <div class="grid-owner">
      <h4>The Sacko Wall</h4>
      <div class="import-help">No punishments — thank Yi — so instead last place gets
        immortalized right here, with a fresh roast every time you look. These publish
        straight to the league page for everyone to see.</div>
      <table class="previewtable">
        <thead><tr><th>Year</th><th>Sacko</th><th>For the record</th></tr></thead>
        <tbody>${sackoRows}</tbody></table>
    </div>
    <div style="display:flex; gap:14px; flex-wrap:wrap;">
      ${statCard("Most titles", s.titles)}
      ${statCard("Most 2nd + 3rd", s.nearly)}
      ${statCard("Most sackos", s.sackos)}
      ${statCard("Most keepers", s.keeps)}
      ${statCard("Full 3-year keeps", s.runs)}
      ${statCard("Most winnings", s.winnings, "$")}
    </div>`;
}

function renderRulesPanel(){
  return `<div class="grid-owner">
    <h4>How the calculator applies your rules</h4>
    <ol style="line-height:1.9; font-size:14px; color:var(--chalk-dim); padding-left:20px;">
      ${RULES_TEXT.map(r=>`<li>${esc(r)}</li>`).join("")}
    </ol>
    <p class="pnote" style="font-size:12px;">This is just a quick-reference copy baked into the tool — the original rules document is still the source of truth, so edit that if anything changes.</p>
  </div>`;
}

function render(){
  // Rebuilding wipes the live fields, and with them any edit that was never
  // committed -- which is exactly the intended behaviour: unsaved means gone.
  if(typeof dirtyFields !== "undefined" && dirtyFields.size){
    dirtyFields.clear();
    renderDirtyBar();
  }
  const app = document.getElementById("app");
  let body = "";
  if(activeTab==="keepers") body = renderKeepersPanel();
  else if(activeTab==="import") body = renderImportPanel();
  else if(activeTab==="draft") body = renderDraftOrderPanel();
  else if(activeTab==="payouts") body = renderPayoutsPanel();
  else if(activeTab==="seasons") body = renderSeasonsPanel();
  else if(activeTab==="hall") body = renderHallPanel();
  else if(activeTab==="guide") body = renderGuidePanel();
  else if(activeTab==="rules") body = renderRulesPanel();
  else if(activeTab==="settings") body = renderSettingsPanel();
  else body = renderKeepersPanel();   // a saved tab that no longer exists
  app.innerHTML = renderHeader() + renderBanner() + renderTabs() + `<div class="panel active">${body}</div>`;
}

async function init(){
  watchFieldSaves();
  watchDirtyFields();
  requestDurableStorage();
  await restoreDirHandle();
  await loadState();
  await rehydrateCreds();
  if(await offerFolderRestore()) render();
  await rehydrateCreds();
  render();                       // show something immediately

  // The cloud copy is the authority, and it is consulted BEFORE this browser is
  // allowed to write anything back. Previously the pull was fired and forgotten
  // while a seeded save was already queued behind it; whichever landed last won,
  // and when that was the seed, the real data was gone.
  if(cloudConfigured()){
    await syncFromCloud();
  } else {
    cloudPullDone = true;         // no cloud to protect; local is all there is
  }

  if(STATE.season !== workingSeason()){
    STATE.season = workingSeason();
    await saveState();
  }
  render();

  // An app update left the league page a version behind. This is that reload.
  try{
    if(localStorage.getItem(PENDING_PUBLISH_KEY) && cloudConfigured() && !isDataOnly()){
      localStorage.removeItem(PENDING_PUBLISH_KEY);
      await publishToGithub(true);
    }
  }catch(e){ console.error("Catch-up publish failed", e); }
}
init();

</script>

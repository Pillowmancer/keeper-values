<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keeper League Command Center</title>
<style>
  :root{
    --field:#12261d;
    --field-dark:#0b1a13;
    --chalk:#f1ead9;
    --chalk-dim:#b9c4ba;
    --gold:#e8ab1f;
    --gold-dim:#8a691c;
    --line:#2c4636;
    --danger:#d9603b;
    --ok:#5fb98a;
    --card:#16301f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 64px),
      linear-gradient(180deg, var(--field) 0%, var(--field-dark) 100%);
    color:var(--chalk);
    font-family: "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .hairline{border-top:2px dashed rgba(241,234,217,0.25);}
  h1,h2,h3{font-family:"Arial Narrow", "Oswald", Impact, sans-serif; text-transform:uppercase; letter-spacing:0.04em; margin:0;}
  .mono{font-family:"SFMono-Regular","Menlo","Consolas",monospace;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px;}

  /* Header */
  .header{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px;
    padding-bottom:18px; margin-bottom:22px; border-bottom:3px solid var(--gold);
  }
  .header .eyebrow{color:var(--gold); font-size:12px; letter-spacing:0.18em; font-weight:700;}
  .header h1{font-size:34px; color:var(--chalk);}
  .header h1 span{color:var(--gold);}
  .season-badge{
    background:var(--gold); color:var(--field-dark); font-weight:800; font-family:"SFMono-Regular",monospace;
    padding:10px 16px; border-radius:4px; font-size:22px; text-align:center; min-width:120px;
  }
  .season-badge small{display:block; font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;}

  /* Banner */
  .banner{
    background:var(--card); border-left:4px solid var(--gold); padding:14px 18px; border-radius:4px;
    margin-bottom:20px; font-size:14px; line-height:1.5; color:var(--chalk-dim);
  }
  .banner b{color:var(--chalk);}

  /* Tabs */
  .tabbar{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .tabbtn{
    background:transparent; border:2px solid var(--line); color:var(--chalk-dim); padding:9px 16px;
    font-weight:700; text-transform:uppercase; letter-spacing:0.04em; font-size:12.5px; border-radius:4px;
    cursor:pointer; transition:all .15s;
  }
  .tabbtn:hover{border-color:var(--gold-dim); color:var(--chalk);}
  .tabbtn.active{background:var(--gold); border-color:var(--gold); color:var(--field-dark);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* Owner accordion */
  .owner-card{background:var(--card); border:1px solid var(--line); border-radius:6px; margin-bottom:14px; overflow:hidden;}
  .owner-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 18px; cursor:pointer;
    background:linear-gradient(90deg, rgba(232,171,31,0.08), transparent);
  }
  .owner-head h3{font-size:19px; color:var(--chalk);}
  .owner-head .meta{font-size:12px; color:var(--chalk-dim); font-family:"SFMono-Regular",monospace;}
  .owner-head .chev{color:var(--gold); font-size:14px; transition:transform .15s;}
  .owner-card.open .chev{transform:rotate(90deg);}
  .owner-body{display:none; padding:0 18px 18px 18px;}
  .owner-card.open .owner-body{display:block;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold-dim);
    padding:8px 8px; border-bottom:2px solid var(--line);
  }
  tbody td{padding:8px; border-bottom:1px solid rgba(44,70,54,0.6); vertical-align:middle;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .pname{font-weight:600; color:var(--chalk);}
  .pnote{font-size:11px; color:var(--chalk-dim); font-style:italic; margin-top:2px;}
  .cost{font-family:"SFMono-Regular",monospace; font-weight:800; font-size:16px;}
  .cost.zero{color:var(--danger);}
  .cost.live{color:var(--gold);}
  .badge{display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px; font-weight:700; text-transform:uppercase;}
  .badge.ineligible{background:rgba(217,96,59,0.18); color:var(--danger);}
  .badge.tie{background:rgba(232,171,31,0.2); color:var(--gold);}
  input[type=number]{width:52px; background:var(--field-dark); border:1px solid var(--line); color:var(--chalk); padding:4px 6px; border-radius:4px; font-family:"SFMono-Regular",monospace;}
  input[type=text]{background:var(--field-dark); border:1px solid var(--line); color:var(--chalk); padding:6px 8px; border-radius:4px;}
  select{background:var(--field-dark); border:1px solid var(--line); color:var(--chalk); padding:5px 6px; border-radius:4px;}
  input[type=checkbox]{width:17px; height:17px; accent-color:var(--gold); cursor:pointer;}
  .rowbtn{background:none; border:none; color:var(--chalk-dim); cursor:pointer; font-size:14px; padding:2px 5px;}
  .rowbtn:hover{color:var(--danger);}
  .chip{display:inline-block; background:var(--field-dark); border:1px solid var(--line); border-radius:10px; padding:1px 8px; font-size:11px; margin:1px 2px 1px 0; font-family:"SFMono-Regular",monospace;}

  .btn{
    background:var(--gold); color:var(--field-dark); border:none; padding:10px 18px; border-radius:4px;
    font-weight:800; text-transform:uppercase; letter-spacing:0.04em; font-size:12.5px; cursor:pointer;
  }
  .btn:hover{background:#f5bb3a;}
  .btn.secondary{background:transparent; border:2px solid var(--gold); color:var(--gold);}
  .btn.secondary:hover{background:rgba(232,171,31,0.1);}
  .btn.small{padding:6px 12px; font-size:11px;}
  .btn.danger{background:var(--danger); color:#fff;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}

  .addform{
    display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; align-items:center;
    background:var(--field-dark); padding:12px; border-radius:6px; margin-top:12px; border:1px dashed var(--line);
  }
  .addform input, .addform select{width:100%;}

  .tiewarn{background:rgba(217,96,59,0.12); border:1px solid var(--danger); color:var(--chalk); padding:10px 14px; border-radius:4px; font-size:12.5px; margin-bottom:10px;}

  /* export views */
  .grid-owner{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px; margin-bottom:14px;}
  .grid-owner h4{color:var(--gold); font-size:14px; margin-bottom:8px;}
  .grid-owner table{font-size:12.5px;}

  footer.credits{text-align:center; color:var(--chalk-dim); font-size:11px; margin-top:40px; letter-spacing:0.05em;}

  .rules-link{color:var(--gold); text-decoration:underline; cursor:pointer; font-size:12px;}
  .search{background:var(--field-dark); border:1px solid var(--line); color:var(--chalk); padding:8px 12px; border-radius:4px; width:220px;}

  /* Import */
  textarea.importbox{
    width:100%; min-height:160px; background:var(--field-dark); border:1px solid var(--line); color:var(--chalk);
    font-family:"SFMono-Regular",monospace; font-size:12.5px; padding:12px; border-radius:6px; resize:vertical;
  }
  .import-help{font-size:12px; color:var(--chalk-dim); line-height:1.6; margin:8px 0 14px 0;}
  .import-help code{background:var(--field-dark); padding:1px 5px; border-radius:3px; color:var(--gold);}
  .previewtable td, .previewtable th{padding:6px 8px; font-size:12px;}
  .rowtag{font-size:10px; padding:1px 6px; border-radius:8px; font-weight:700; text-transform:uppercase;}
  .rowtag.new{background:rgba(95,185,138,0.18); color:var(--ok);}
  .rowtag.update{background:rgba(232,171,31,0.18); color:var(--gold);}
  .rowtag.skip{background:rgba(217,96,59,0.18); color:var(--danger);}
  .import-mode{display:flex; gap:16px; margin-bottom:12px; font-size:13px;}
  .import-mode label{display:flex; align-items:center; gap:6px; cursor:pointer;}
</style>
</head>

/* ---------- Rules engine ---------- */
function getCostForSeason(player, season){
  const prior = (player.keptSeasons||[]).filter(k => k.year < season).sort((a,b)=>a.year-b.year);
  if(prior.length === 0){
    return { cost: player.draftRound, priorCount: 0 };
  }
  const last = prior[prior.length-1];
  return { cost: last.cost - 1, priorCount: prior.length };
}

function getStatus(player, season){
  if(player.manualIneligible){
    return { eligible:false, cost:0, reason: player.note || "Marked ineligible" };
  }
  if(!player.draftRound){
    return { eligible:false, cost:0, reason: "Draft round unknown — enter it to activate" };
  }
  if(player.draftRound === 1){
    return { eligible:false, cost:0, reason: "1st-round pick — never keeper-eligible" };
  }
  const { cost, priorCount } = getCostForSeason(player, season);
  if(priorCount >= 2){
    return { eligible:false, cost:0, reason: "3-year keeper max already reached" };
  }
  if(cost <= 1){
    return { eligible:false, cost:0, reason: "Reached 1st-round value — no longer keepable" };
  }
  return { eligible:true, cost, reason:null };
}

function ownerKeptCount(owner){
  return STATE.players.filter(p => p.owner===owner && p.keepThisYear).length;
}

function tiesForOwner(owner){
  const kept = STATE.players.filter(p => p.owner===owner && p.keepThisYear);
  const groups = {};
  kept.forEach(p=>{
    const st = getStatus(p, STATE.season);
    const effCost = (p.overrideCost!=null) ? p.overrideCost : st.cost;
    groups[effCost] = groups[effCost] || [];
    groups[effCost].push(p);
  });
  const ties = [];
  Object.keys(groups).forEach(k=>{
    if(groups[k].length > 1) ties.push(groups[k]);
  });
  return ties;
}

window.toggleKeep = function(id){
  const p = STATE.players.find(x=>x.id===id);
  if(!p) return;
  if(!p.keepThisYear){
    const count = ownerKeptCount(p.owner);
    if(count >= 2){
      alert(p.owner + " already has 2 players marked as keepers this season. Uncheck one first.");
      return;
    }
  } else {
    p.overrideCost = null;
  }
  p.keepThisYear = !p.keepThisYear;
  saveState();
  render();
}

window.lockSeason = function(){
  const season = STATE.season;
  let lockedCount = 0;
  const summary = [];
  STATE.players.forEach(p=>{
    if(p.keepThisYear){
      const st = getStatus(p, season);
      if(st.eligible){
        const cost = (p.overrideCost!=null) ? p.overrideCost : st.cost;
        p.keptSeasons = p.keptSeasons || [];
        p.keptSeasons.push({ year: season, cost });
        summary.push(p.owner + " keeps " + p.name + " (Rd " + cost + ")");
        lockedCount++;
      }
    }
    p.keepThisYear = false;
    p.overrideCost = null;
  });
  STATE.season = season + 1;
  saveState();
  render();
  alert("Locked " + season + " keepers (" + lockedCount + " total). Now working on " + STATE.season + ".\n\n" + summary.join("\n"));
}

function downloadCSV(filename, content){
  const blob = new Blob([content], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

window.exportValueListCSV = function(){
  const season = STATE.season;
  let rows = [];
  const maxRows = Math.max(...OWNERS.map(o => STATE.players.filter(p=>p.owner===o).length));
  const header = [];
  OWNERS.forEach(o => header.push(o, "", ""));
  rows.push(header);
  const subhead = [];
  OWNERS.forEach(() => subhead.push("Player","Salary",""));
  rows.push(subhead);
  for(let i=0;i<maxRows;i++){
    const row = [];
    OWNERS.forEach(o=>{
      const list = STATE.players.filter(p=>p.owner===o);
      const p = list[i];
      if(p){
        const st = getStatus(p, season);
        row.push(p.name, st.eligible ? st.cost : 0, "");
      } else {
        row.push("","","");
      }
    });
    rows.push(row);
  }
  const csv = rows.map(r=>r.map(c=>String(c).includes(",")?'"'+c+'"':c).join(",")).join("\n");
  downloadCSV("Keeper_Value_List_"+season+".csv", csv);
}

/* ---------- Bulk Import ---------- */
let importMode = "draft"; // "draft" or "waiver"
let importPreview = [];

window.setImportMode = function(mode){
  importMode = mode;
  importPreview = [];
  render();
}

function fuzzyFindOwner(raw){
  const clean = raw.trim().toLowerCase();
  return OWNERS.find(o => o.toLowerCase() === clean)
    || OWNERS.find(o => o.toLowerCase().startsWith(clean))
    || OWNERS.find(o => clean.startsWith(o.toLowerCase()))
    || null;
}

function parseRoundToken(tok){
  if(tok == null) return null;
  const t = String(tok).trim().toLowerCase();
  if(t === "" ) return null;
  if(t.includes("waiver") || t.includes("fa") || t === "8+" ) return 8;
  const n = parseInt(t.replace(/[^0-9]/g,""), 10);
  if(isNaN(n)) return null;
  return Math.min(8, Math.max(1, n));
}

// Splits a pasted line on tabs, or falls back to commas
function splitLine(line){
  if(line.indexOf(String.fromCharCode(9)) !== -1) return line.split(String.fromCharCode(9)).map(s=>s.trim());
  return line.split(",").map(s=>s.trim());
}

window.parseImportPreview = function(){
  const text = document.getElementById("importtext").value;
  const lines = text.split(String.fromCharCode(10)).map(l=>l.trim()).filter(Boolean);
  const rows = [];
  lines.forEach(line=>{
    const parts = splitLine(line);
    if(parts.length < 2) return;
    let owner, name, round;
    if(importMode === "draft"){
      // Expect: Owner, Player, Round   (round col optional per-row order; try to detect)
      if(parts.length >= 3){
        owner = parts[0]; name = parts[1]; round = parseRoundToken(parts[2]);
      } else {
        owner = parts[0]; name = parts[1]; round = null;
      }
    } else {
      // Waiver mode: Owner, Player -> always round 8
      owner = parts[0]; name = parts[1]; round = 8;
    }
    const matchedOwner = fuzzyFindOwner(owner);
    rows.push({ rawOwner: owner, owner: matchedOwner, name, round });
  });

  importPreview = rows.map(r=>{
    if(!r.owner){
      return { ...r, action:"skip", reason:"Owner not recognized: " + r.rawOwner };
    }
    if(!r.name){
      return { ...r, action:"skip", reason:"Missing player name" };
    }
    const existing = STATE.players.find(p => p.owner===r.owner && p.name.toLowerCase()===r.name.toLowerCase());
    if(existing){
      return { ...r, action:"update", reason: "Round " + existing.draftRound + " -> " + (r.round!=null?r.round:"?") , existingId: existing.id };
    }
    return { ...r, action: r.round!=null ? "new" : "skip", reason: r.round!=null ? "Will be added" : "No round given" };
  });
  render();
}

window.applyImportPreview = function(){
  let added=0, updated=0;
  importPreview.forEach(r=>{
    if(r.action==="update" && r.round!=null){
      const p = STATE.players.find(x=>x.id===r.existingId);
      if(p){ p.draftRound = r.round; updated++; }
    } else if(r.action==="new" && r.round!=null){
      STATE.players.push({
        id: uid(), name: r.name, owner: r.owner, draftRound: r.round, keptSeasons: [],
        manualIneligible:false, note:"", keepThisYear:false, overrideCost:null
      });
      added++;
    }
  });
  importPreview = [];
  document.getElementById("importtext").value = "";
  saveState();
  render();
  alert("Import complete: " + added + " new players added, " + updated + " existing players updated.");
}

  OWNERS.forEach(o=>{
    const kept = STATE.players.filter(p=>p.owner===o && (p.keptSeasons||[]).length>0);
    if(kept.length===0){ rows.push([o,"","","","",""]); return; }
    kept.forEach((p,idx)=>{
      const seasons = p.keptSeasons.map(k=>k.year).join(", ");
      const st = getStatus(p, STATE.season);
      rows.push([idx===0?o:"", p.name, seasons, p.keptSeasons.length, st.eligible?st.cost:0, p.note||""]);
    });
  });
  const csv = rows.map(r=>r.map(c=>String(c).includes(",")?'"'+c+'"':c).join(",")).join("\n");
  downloadCSV("Legacy_Keeper_Tracker_"+STATE.season+".csv", csv);
}

/* ---------- Rendering ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderHeader(){
  return `
  <div class="header">
    <div>
      <div class="eyebrow">Fantasy Football · Keeper Ops</div>
      <h1>The <span>Keeper</span> Ledger</h1>
    </div>
    <div class="season-badge">
      <small>Working Season</small>
      ${STATE.season}
    </div>
  </div>`;
}

function renderBanner(){
  return `<div class="banner">
    <b>Seeded from your uploaded 2025–26 value list + legacy tracker.</b>
    Draft rounds were back-calculated from last season's salary numbers, and known keeper history was pulled from your legacy tracker.
    A few zero-salary players couldn't be reconstructed automatically (dropped players, unclear rounds) — they're marked <span class="badge ineligible">needs round</span> below.
    Confirm who actually got kept for ${STATE.season}, fix anything that looks off, then hit <b>Lock Season</b> to move to ${STATE.season+1} — from then on this does the recalculation for you every year.
  </div>`;
}

function renderTabs(){
  const tabs = [["keepers","Keepers"],["import","Bulk Import"],["valuelist","Value List"],["legacy","Legacy Tracker"],["rules","Rules"]];
  return `<div class="tabbar">
    ${tabs.map(([k,label])=>`<button class="tabbtn ${activeTab===k?'active':''}" onclick="setTab('${k}')">${label}</button>`).join("")}
  </div>`;
}

function renderKeepersToolbar(){
  return `<div class="toolbar">
    <button class="btn secondary small" onclick="changeSeasonView(-1)">&larr; ${STATE.season-1}</button>
    <button class="btn secondary small" onclick="changeSeasonView(1)">${STATE.season+1} &rarr;</button>
    <input class="search" placeholder="Search player or owner..." oninput="onSearch(this.value)" value="${esc(searchQuery)}">
    <span style="flex:1"></span>
    <button class="btn" onclick="lockSeason()">Lock ${STATE.season} Keepers &rarr; Advance to ${STATE.season+1}</button>
  </div>`;
}

function playerRow(p){
  const st = getStatus(p, STATE.season);
  const costDisplay = st.eligible ? st.cost : 0;
  const costClass = st.eligible ? "live" : "zero";
  const keptChips = (p.keptSeasons||[]).map(k=>`<span class="chip">${k.year} · Rd${k.cost} <span class="rowbtn" style="padding:0 0 0 4px" onclick="removeKeptYear('${p.id}',${k.year})">&times;</span></span>`).join(" ") || '<span class="pnote">none yet</span>';
  const roundOptions = [1,2,3,4,5,6,7,8].map(r=>`<option value="${r}" ${p.draftRound===r?'selected':''}>${r===8?'8+ / Waiver':r}</option>`).join("");
  return `<tr>
    <td>
      <div class="pname">${esc(p.name)}</div>
      ${p.note ? `<div class="pnote" onclick="editNote('${p.id}')" style="cursor:pointer">${esc(p.note)} ✎</div>` : `<div class="pnote" onclick="editNote('${p.id}')" style="cursor:pointer;opacity:.4">+ add note</div>`}
    </td>
    <td><select onchange="setDraftRound('${p.id}', this.value)"><option value="">—</option>${roundOptions}</select></td>
    <td>${keptChips}</td>
    <td>
      <span class="cost mono ${costClass}">${costDisplay}</span>
      ${!st.eligible ? `<div><span class="badge ineligible">${esc(st.reason)}</span></div>` : ""}
    </td>
    <td style="text-align:center;">
      <input type="checkbox" ${p.manualIneligible?'checked':''} onchange="toggleManualIneligible('${p.id}')" title="Mark ineligible (roster/4-week rule)">
    </td>
    <td style="text-align:center;">
      <input type="checkbox" ${p.keepThisYear?'checked':''} ${!st.eligible && !p.keepThisYear ? 'disabled' : ''} onchange="toggleKeep('${p.id}')">
    </td>
    <td>
      ${p.keepThisYear ? `<input type="number" placeholder="Rd" value="${p.overrideCost!=null?p.overrideCost:''}" onchange="setOverride('${p.id}', this.value)" title="Override round (tie-break)">` : ""}
    </td>
    <td><button class="rowbtn" onclick="removePlayer('${p.id}')" title="Remove">🗑</button></td>
  </tr>`;
}

function renderOwnerCard(owner){
  let players = STATE.players.filter(p=>p.owner===owner);
  if(searchQuery){
    if(!owner.toLowerCase().includes(searchQuery)){
      players = players.filter(p=>p.name.toLowerCase().includes(searchQuery));
      if(players.length===0) return "";
    }
  }
  const isOpen = openOwners.has(owner) || (searchQuery && players.length>0 && players.length < STATE.players.filter(p=>p.owner===owner).length);
  const keptCount = ownerKeptCount(owner);
  const ties = tiesForOwner(owner);
  const tieWarn = ties.length ? `<div class="tiewarn">⚠ Tie detected: ${ties.map(g=>g.map(p=>esc(p.name)).join(" & ")).join(", ")} land on the same round. Set an override round (the box next to Keep) for one of them so they don't collide.</div>` : "";
  return `<div class="owner-card ${isOpen?'open':''}">
    <div class="owner-head" onclick="toggleOwner('${owner}')">
      <h3><span class="chev">&#9656;</span> ${owner}</h3>
      <div class="meta">${players.length} tracked · ${keptCount}/2 keeper slots used</div>
    </div>
    <div class="owner-body">
      ${tieWarn}
      <table>
        <thead><tr>
          <th style="width:22%">Player</th>
          <th style="width:10%">Draft Rd</th>
          <th style="width:16%">Kept Seasons</th>
          <th style="width:12%">Cost ${STATE.season}</th>
          <th style="width:8%">Ineligible?</th>
          <th style="width:8%">Keep?</th>
          <th style="width:8%">Override</th>
          <th style="width:4%"></th>
        </tr></thead>
        <tbody>${players.map(playerRow).join("")}</tbody>
      </table>
      <div class="addform">
        <input type="text" id="addname-${owner}" placeholder="New player name (draft pick or waiver add)">
        <select id="addround-${owner}">
          <option value="1">Round 1</option><option value="2">Round 2</option><option value="3">Round 3</option>
          <option value="4">Round 4</option><option value="5">Round 5</option><option value="6">Round 6</option>
          <option value="7">Round 7</option><option value="8" selected>8+ / Waiver</option>
        </select>
        <span></span>
        <button class="btn small" onclick="addPlayer('${owner}')">+ Add Player</button>
      </div>
    </div>
  </div>`;
}

function renderKeepersPanel(){
  return renderKeepersToolbar() + OWNERS.map(renderOwnerCard).join("");
}

function renderValueListPanel(){
  const season = STATE.season;
  const owners = OWNERS;
  let cols = "";
  owners.forEach(o=>{
    const players = STATE.players.filter(p=>p.owner===o);
    cols += `<div class="grid-owner">
      <h4>${o}</h4>
      <table><thead><tr><th>Player</th><th>Salary</th></tr></thead><tbody>
      ${players.map(p=>{
        const st = getStatus(p, season);
        return `<tr><td>${esc(p.name)}</td><td class="mono ${st.eligible?'live':'zero'} cost">${st.eligible?st.cost:0}</td></tr>`;
      }).join("")}
      </tbody></table>
    </div>`;
  });
  return `<div class="toolbar"><button class="btn" onclick="exportValueListCSV()">&#8681; Download ${season} Value List CSV</button></div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;">${cols}</div>`;
}

function renderLegacyPanel(){
  const owners = OWNERS;
  let rows = "";
  owners.forEach(o=>{
    const kept = STATE.players.filter(p=>p.owner===o && (p.keptSeasons||[]).length>0);
    if(kept.length===0){
      rows += `<tr><td class="pname">${o}</td><td colspan="4" class="pnote">no active legacy keepers</td></tr>`;
    } else {
      kept.forEach((p,idx)=>{
        const st = getStatus(p, STATE.season);
        rows += `<tr>
          <td class="pname">${idx===0?o:""}</td>
          <td>${esc(p.name)}</td>
          <td class="mono">${p.keptSeasons.map(k=>k.year).join(", ")}</td>
          <td class="mono">${p.keptSeasons.length}</td>
          <td class="mono ${st.eligible?'live':'zero'} cost">${st.eligible?st.cost:0}</td>
        </tr>`;
      });
    }
  });
  return `<div class="toolbar"><button class="btn" onclick="exportLegacyCSV()">&#8681; Download Legacy Tracker CSV</button></div>
  <div class="grid-owner">
    <table><thead><tr><th>Owner</th><th>Legacy Keeper</th><th>Seasons Kept</th><th>Years Used</th><th>Cost ${STATE.season}</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}

function renderImportPanel(){
  const modeHelp = importMode === "draft"
    ? `Paste one player per line: <code>Owner, Player Name, Round</code> — or straight from a spreadsheet/Yahoo's Draft Results page (tab-separated works too). If you leave the round column off, existing players just won't update and new players will be skipped until you add it.`
    : `Paste one pickup per line: <code>Owner, Player Name</code> — these are always priced at Round 8 per your waiver rule, no round column needed.`;

  const previewRows = importPreview.map(r=>`
    <tr>
      <td>${esc(r.rawOwner)}${r.owner && r.owner!==r.rawOwner ? ` <span class="pnote">&rarr; ${r.owner}</span>` : ""}</td>
      <td>${esc(r.name||"")}</td>
      <td class="mono">${r.round!=null?r.round:"—"}</td>
      <td><span class="rowtag ${r.action}">${r.action}</span></td>
      <td class="pnote">${esc(r.reason||"")}</td>
    </tr>`).join("");

  const actionable = importPreview.filter(r=>r.action==="new"||r.action==="update").length;

  return `<div class="grid-owner">
    <h4>Bulk import draft results or waiver adds</h4>
    <div class="import-mode">
      <label><input type="radio" name="importmode" ${importMode==='draft'?'checked':''} onclick="setImportMode('draft')"> New draft results</label>
      <label><input type="radio" name="importmode" ${importMode==='waiver'?'checked':''} onclick="setImportMode('waiver')"> Waiver/FA pickups</label>
    </div>
    <div class="import-help">${modeHelp}<br>Owner names are matched loosely (case-insensitive, partial match ok) against: ${OWNERS.join(", ")}.</div>
    <textarea class="importbox" id="importtext" placeholder="${importMode==='draft' ? 'One player per line, e.g.: Vyas, Justin Fields, 8' : 'One pickup per line, e.g.: Frank, Some Waiver Pickup'}"></textarea>
    <div class="toolbar" style="margin-top:10px;">
      <button class="btn secondary small" onclick="parseImportPreview()">Preview</button>
      ${importPreview.length ? `<button class="btn small" onclick="applyImportPreview()">Apply ${actionable} row${actionable===1?'':'s'}</button>` : ""}
    </div>
    ${importPreview.length ? `
      <table class="previewtable">
        <thead><tr><th>Owner</th><th>Player</th><th>Round</th><th>Action</th><th>Detail</th></tr></thead>
        <tbody>${previewRows}</tbody>
      </table>` : ""}
  </div>
  <div class="grid-owner">
    <h4>Want this to run itself?</h4>
    <p class="pnote" style="font-size:12.5px; font-style:normal; line-height:1.7;">
      A companion script can pull draft results and transactions straight from Yahoo's API and generate a file in exactly this paste format —
      ask for it any time. It needs Yahoo API access approved on their developer portal first (yours to apply for, since it's tied to your account),
      then runs locally on your machine once a year.
    </p>
  </div>`;
}

function renderRulesPanel(){
  return `<div class="grid-owner">
    <h4>How the calculator applies your rules</h4>
    <ol style="line-height:1.9; font-size:14px; color:var(--chalk-dim); padding-left:20px;">
      ${RULES_TEXT.map(r=>`<li>${esc(r)}</li>`).join("")}
    </ol>
    <p class="pnote" style="font-size:12px;">Edit the original rules document any time — this list is just a reference copy baked into the tool.</p>
  </div>`;
}

function render(){
  const app = document.getElementById("app");
  let body = "";
  if(activeTab==="keepers") body = renderKeepersPanel();
  else if(activeTab==="import") body = renderImportPanel();
  else if(activeTab==="valuelist") body = renderValueListPanel();
  else if(activeTab==="legacy") body = renderLegacyPanel();
  else if(activeTab==="rules") body = renderRulesPanel();
  app.innerHTML = renderHeader() + renderBanner() + renderTabs() + `<div class="panel active">${body}</div>`;
}

async function init(){
  await loadState();
  render();
}
init();

</script>
</body>
</html>

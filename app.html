<script>
(function(){
  var P = JSON.parse(document.getElementById("blob").textContent);
  var msg = function(t){ document.getElementById("msg").textContent = t; };
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  if(!(window.crypto && crypto.subtle)){
    msg("This browser cannot decrypt here. Open the https:// address, not a local file.");
    document.getElementById("go").disabled = true; return;
  }
  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var pw = document.getElementById("pw").value;
    if(!pw){ msg("Type the password."); return; }
    var go = document.getElementById("go");
    go.disabled = true; go.textContent = "Unlocking\u2026"; msg("");
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256" },
          km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(P.iv) }, key, b64(P.ct));
      })
      .then(function(buf){
        if(!P.gz) return buf;
        if(typeof DecompressionStream === "undefined")
          throw new Error("This browser is too old to unpack the page.");
        return new Response(new Blob([buf]).stream()
          .pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
      })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        document.open(); document.write(html); document.close();
      })
      .catch(function(e){
        go.disabled = false; go.textContent = "Unlock";
        msg(/too old/.test(e.message || "") ? e.message : "Wrong password.");
      });
  });
})();
</script>
